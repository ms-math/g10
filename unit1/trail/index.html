<style>

<body>
<style>
/* Layout: one 4:3-ish "monitor" centred on a dark desk — pixel scene on top, green-screen text below, status bar pinned under it.
   Deliberately single-theme: an Apple II lab screen looks the same in light or dark mode. */
:root{
  --desk:#0b0d10; --crt:#000000; --bezel:#1d2026;
  --green:#41ff5f; --green-dim:#1f9a33; --white:#f4f4ec; --orange:#ff8a2a; --violet:#d65cff; --blue:#3aa8ff; --red:#ff4b4b; --yellow:#ffe14a;
  --f-text:"VT323", "Courier New", monospace;
  --f-title:"Press Start 2P", "Courier New", monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--green);font-family:var(--f-text);font-size:24px;line-height:1.15;margin:0}
.desk{min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding-inline:16px;padding-block:14px}
.monitor{width:100%;max-width:980px;background:var(--bezel);border-radius:14px;padding:12px}
.crt{position:relative;background:var(--crt);border-radius:6px;overflow:hidden;min-height:560px;display:flex;flex-direction:column}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.crt.q canvas{width:min(100%,calc(15vh * 2.9167))}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 14px;color:var(--green-dim);font-size:20px;border-bottom:2px solid #0f3016}
.topbar button{font:inherit;background:none;border:1px solid var(--green-dim);color:var(--green);padding:0 8px;cursor:pointer}
canvas{display:block;width:min(100%,calc(28vh * 2.9167));margin:0 auto;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#main{flex:1;padding:14px 22px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.status{border-top:2px solid #0f3016;padding:6px 14px 8px;display:flex;flex-wrap:wrap;gap:4px 22px;font-size:21px;color:var(--white)}
.status b{color:var(--green);font-weight:400}
.track{width:100%;color:var(--green-dim);white-space:pre;overflow:hidden;font-size:19px}
h1{font-family:var(--f-title);font-size:clamp(18px,3.2vw,30px);color:var(--orange);margin:6px 0 2px;line-height:1.35;text-align:center;letter-spacing:.02em}
h2{font-family:var(--f-title);font-size:clamp(12px,1.7vw,16px);color:var(--yellow);margin:2px 0;line-height:1.5}
p{margin:0}
.white{color:var(--white)} .orange{color:var(--orange)} .blue{color:var(--blue)} .violet{color:var(--violet)} .red{color:var(--red)} .yellow{color:var(--yellow)} .dim{color:var(--green-dim)}
.center{text-align:center}
.menu{display:flex;flex-direction:column;gap:2px;margin:4px 0}
.menu button,.btn{font:inherit;text-align:left;background:none;border:none;color:var(--white);padding:2px 6px;cursor:pointer}
.menu button .k,.btn .k{color:var(--orange)}
.menu button:hover,.menu button:focus-visible,.btn:hover,.btn:focus-visible{background:var(--green);color:#000;outline:none}
.menu button:hover .k,.menu button:focus-visible .k,.btn:hover .k,.btn:focus-visible .k{color:#000}
.prompt{color:var(--green)}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
.eqs{font-size:30px;color:var(--white);display:flex;flex-direction:column;gap:2px}
.story{color:var(--white);max-width:60ch}
.answer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:30px;color:var(--white)}
input{font:inherit;font-size:30px;width:4.6em;background:#000;color:var(--yellow);border:2px solid var(--green);padding:0 6px;text-align:center;caret-color:var(--yellow)}
input:focus{outline:none;border-color:var(--yellow)}
input.name{width:9em;text-align:left;font-size:26px}
.msg{padding:6px 10px;border:2px solid currentColor}
.msg.good{color:var(--green)} .msg.bad{color:var(--red)} .msg.hint{color:var(--yellow)} .msg.info{color:var(--blue)}
.steps{color:var(--white);border:2px dashed var(--green-dim);padding:6px 12px}
.steps ol{margin:4px 0 0;padding-left:1.6em;display:flex;flex-direction:column;gap:3px}
.steps .why{color:var(--green-dim)} .steps .work{color:var(--yellow)}
table.area{border-collapse:collapse;color:var(--yellow);margin:2px 0}
table.area td{padding:0 12px;text-align:center}
table.area tr:first-child td{border-bottom:2px solid var(--yellow)}
table.area td:first-child{border-right:2px solid var(--yellow)}
.row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.store td{padding:2px 12px 2px 0;color:var(--white)}
.store button{font:inherit;background:none;border:1px solid var(--green);color:var(--green);min-width:2em;cursor:pointer}
.store button:focus-visible{background:var(--green);color:#000;outline:none}
.report{border-collapse:collapse;color:var(--white)}
.report td,.report th{padding:1px 14px 1px 0;text-align:left;font-weight:400}
.report th{color:var(--green-dim)}
.tomb{border:3px solid var(--white);border-radius:60px 60px 4px 4px;padding:26px 18px 16px;max-width:420px;margin:6px auto;text-align:center;color:var(--white)}
.cont{color:var(--green-dim)}
@media (max-width:640px){body{font-size:20px}.eqs,.answer,input{font-size:24px}.crt{min-height:0}#main{padding:12px 14px}}
</style>

<div class="desk"><div class="monitor"><div class="crt" id="crt">
  <div class="topbar"><span>UNIT 1 REVIEW · GRADE 10 MATH</span><button id="soundBtn" type="button" aria-pressed="false">SOUND: OFF</button></div>
  <canvas id="scene" width="280" height="96" aria-hidden="true"></canvas>
  <div id="main" aria-live="polite"></div>
  <div class="status" id="status" hidden></div>
</div></div></div>

<script>
(function(){
"use strict";
/* ============ math helpers (shared with the Unit 1 practice page) ============ */
const M="−";
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nz=(a,b)=>{let v;do{v=ri(a,b)}while(v===0);return v};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const sn=n=>n<0?M+Math.abs(n):String(n);
const kStr=k=>k===1?"":k===-1?M:sn(k);
const coefTerm=(c,v)=>(c===1?"":c===-1?M:sn(c))+v;
function poly(terms){let s="";for(const [c,v] of terms){if(c===0)continue;const a=Math.abs(c);const body=v?(a===1?"":a)+v:String(a);s+=s===""?(c<0?M:"")+body:(c<0?" "+M+" ":" + ")+body;}return s||"0";}
const lin=(m,b,v="x")=>poly([[m,v],[b,""]]);
function F(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}}
const fval=f=>f.n/f.d;
const fstr=f=>f.d===1?sn(f.n):(f.n<0?M:"")+Math.abs(f.n)+"/"+f.d;
const isInt=f=>f.d===1;
function mul(k,x){return k===1?(x<0?`(${sn(x)})`:sn(x)):k===-1?`${M}(${sn(x)})`:`${sn(k)}(${sn(x)})`}
function evalStr(m,b,x){let s=mul(m,x);if(b>0)s+=` + ${b}`;else if(b<0)s+=` ${M} ${-b}`;return s}
function signedTimes(k,inner){const a=Math.abs(k);if(a===1&&/^\d+$/.test(inner))return `${k<0?M:"+"} ${inner}`;return `${k<0?M:"+"} ${a===1?"":a}(${inner})`}
function linSteps(A,B,C,D,v="x"){
  const st=[];const a=A-C;
  if(C!==0)st.push([`${C>0?"Subtract":"Add"} ${coefTerm(Math.abs(C),v)} ${C>0?"from":"to"} both sides`,`${poly([[a,v],[B,""]])} = ${sn(D)}`]);
  if(B!==0)st.push([`${B>0?"Subtract":"Add"} ${Math.abs(B)} ${B>0?"from":"to"} both sides`,`${poly([[a,v]])} = ${sn(D-B)}`]);
  const ans=F(D-B,a);
  if(a!==1)st.push([`Divide both sides by ${sn(a)}`,`${v} = ${fstr(ans)}`]);
  return{st,ans};
}
const yEq=(m,b,rev)=>rev?`y = ${poly([[b,""],[m,"x"]])}`:`y = ${lin(m,b)}`;

/* comparison: y = m1x + b1 and y = m2x + b2 */
function compPack(m1,b1,m2,b2,x0,y0){
  const {st}=linSteps(m1,b1,m2,b2);
  const steps=[["Both equations equal y, so set ① equal to ②",`${lin(m1,b1)} = ${lin(m2,b2)}`],...st,
    [`Substitute x = ${sn(x0)} into ①`,`y = ${evalStr(m1,b1,x0)} = ${sn(y0)}`],
    ["Check in ②",`y = ${evalStr(m2,b2,x0)} = ${sn(y0)} ✓`],
    ["Conclusion",`∴ The point of intersection is (${sn(x0)}, ${sn(y0)}).`]];
  const xm=[];
  if(b1!==0||b2!==0)xm.push({val:F(b2+b1,m1-m2),msg:"When a number moves across the equals sign, it changes sign. Check that step."});
  if(m1+m2!==0)xm.push({val:F(b2-b1,m1+m2),msg:`To get the x-terms together, ${m2>0?"subtract":"add"} ${coefTerm(Math.abs(m2),"x")} on both sides. It changes sign when it moves.`});
  return{steps,xm,tests:[(x,y)=>Math.abs(y-(m1*x+b1))<1e-6,(x,y)=>Math.abs(y-(m2*x+b2))<1e-6]};
}
/* substitution: A x + B y = C with y = m x + b (or x = m y + b when xform) */
function subPack(A,B,C,m,b,xform,x0,y0){
  const den=xform?A*m+B:A+B*m;let steps,am=[];
  if(!xform){
    const {st}=linSteps(den,B*b,0,C);
    steps=[[`Replace y in ① with (${lin(m,b)}). Keep the brackets`,`${A===1?"x":A===-1?M+"x":sn(A)+"x"} ${signedTimes(B,lin(m,b))} = ${sn(C)}`],
      ["Expand the brackets",`${poly([[A,"x"],[B*m,"x"],[B*b,""]])} = ${sn(C)}`],
      ["Collect like terms",`${lin(den,B*b)} = ${sn(C)}`],...st,
      [`Substitute x = ${sn(x0)} into ②`,`y = ${evalStr(m,b,x0)} = ${sn(y0)}`],
      ["Check in ①",`${mul(A,x0)} ${signedTimes(B,sn(y0))} = ${sn(C)} ✓`],
      ["Conclusion",`∴ The point of intersection is (${sn(x0)}, ${sn(y0)}).`]];
    if(B!==1&&A+B*m!==0)am.push({val:F(C-b,A+B*m),msg:`Multiply ${sn(B)} by both terms in the brackets, not just the first one.`});
    if(B<0)am.push({val:F(C+B*b,den),msg:`${sn(B)} times ${sn(b)} is ${sn(B*b)}. Watch the signs when you multiply a negative into the brackets.`});
  }else{
    const {st}=linSteps(den,A*b,0,C,"y");
    steps=[[`Replace x in ① with (${lin(m,b,"y")}). Keep the brackets`,`${kStr(A)}(${lin(m,b,"y")}) ${B<0?M:"+"} ${coefTerm(Math.abs(B),"y")} = ${sn(C)}`],
      ["Expand the brackets",`${poly([[A*m,"y"],[A*b,""],[B,"y"]])} = ${sn(C)}`],
      ["Collect like terms",`${lin(den,A*b,"y")} = ${sn(C)}`],...st,
      [`Substitute y = ${sn(y0)} into ②`,`x = ${evalStr(m,b,y0)} = ${sn(x0)}`],
      ["Check in ①",`${mul(A,x0)} ${signedTimes(B,sn(y0))} = ${sn(C)} ✓`],
      ["Conclusion",`∴ The point of intersection is (${sn(x0)}, ${sn(y0)}).`]];
    if(A!==1&&A*m+B!==0)am.push({val:F(C-b,A*m+B),msg:`Multiply ${sn(A)} by both terms in the brackets, not just the first one.`});
    if(A<0)am.push({val:F(C+A*b,den),msg:`${sn(A)} times ${sn(b)} is ${sn(A*b)}. Watch the signs when you multiply a negative into the brackets.`});
  }
  const t1=(x,y)=>Math.abs(A*x+B*y-C)<1e-6;
  const t2=xform?(x,y)=>Math.abs(x-(m*y+b))<1e-6:(x,y)=>Math.abs(y-(m*x+b))<1e-6;
  return{steps,xm:am,tests:[t1,t2]};
}

/* ============ generators ============ */
function genSolve(L){
  for(let t=0;t<500;t++){
    let A,B,C,D,x,disp,bracket=null;
    if(L===0){A=ri(2,9);x=ri(-5,10);B=nz(-12,15);C=0;D=A*x+B;disp=Math.random()<.25?`${sn(D)} = ${lin(A,B)}`:`${lin(A,B)} = ${sn(D)}`;}
    else if(L===1){
      x=ri(-6,10);C=nz(-6,9);B=nz(-15,15);
      if(Math.random()<.35){const k=pick([2,3,4,5,-2,-3]);const r=nz(-6,6);A=k;B=k*r;if(A===C)continue;bracket={k,r};}
      else{A=nz(-6,9);if(A===C)continue;}
      D=(A-C)*x+B;if(Math.abs(D)>45)continue;
      disp=bracket?`${kStr(bracket.k)}(${lin(1,bracket.r)}) = ${lin(C,D)}`:`${lin(A,B)} = ${lin(C,D)}`;
    }else{
      const k=pick([2,3,4,5,6,-2,-3,-4,-5]),q=pick([1,1,2,3]),r=nz(-8,8);
      A=k*q;B=k*r;bracket={k,q,r};
      if(Math.random()<.4){C=nz(-7,9);D=nz(-30,30);const a=A-C;if(a===0||Math.abs(a)>9||(D-B)%a===0)continue;x=null;}
      else{C=nz(-7,9);if(A===C)continue;x=nz(-9,9);D=(A-C)*x+B;if(Math.abs(D)>60)continue;}
      let right=lin(C,D);
      if(Math.random()<.4&&C!==1&&C!==-1&&D%C===0&&D!==0)right=`${kStr(C)}(${lin(1,D/C)})`;
      disp=`${kStr(k)}(${lin(q,r)}) = ${right}`;
    }
    const pre=bracket?[["Expand the brackets",`${lin(A,B)} = ${lin(C,D)}`]]:[];
    const {st,ans}=linSteps(A,B,C,D);
    if(x!==null&&x!==undefined&&fval(ans)!==x)continue;
    const L1=F(A*ans.n+B*ans.d,ans.d),R1=F(C*ans.n+D*ans.d,ans.d);
    const steps=[...pre,...st,["Check: put it back into both sides",`left = ${fstr(L1)}, right = ${fstr(R1)} ✓`]];
    const mistakes=[{val:F(-ans.n,ans.d),msg:"The sign of your answer is wrong. Check the step where you divide, and any negatives you moved across."}];
    if(B!==0)mistakes.push({val:F(D+B,A-C),msg:`When you move ${sn(B)} to the other side, use the opposite operation, so it changes sign.`});
    if(C!==0&&A+C!==0)mistakes.push({val:F(D-B,A+C),msg:`To move ${coefTerm(C,"x")} across, ${C>0?"subtract":"add"} ${coefTerm(Math.abs(C),"x")} on both sides. It changes sign.`});
    if(bracket&&bracket.k!==1&&A-C!==0)mistakes.push({val:F(D-bracket.r,A-C),msg:`Multiply ${sn(bracket.k)} by both terms inside the brackets, not just the first one.`});
    const hint=bracket?`Expand first: multiply ${sn(bracket.k)} by every term inside the brackets. Then collect the x-terms on one side.`
      :C!==0?`Get the x-terms on one side: ${C>0?"subtract":"add"} ${coefTerm(Math.abs(C),"x")} ${C>0?"from":"to"} both sides. Then deal with the numbers.`
      :`Reverse BEDMAS: undo the ${B>0?"+ "+B:M+" "+(-B)} first, then divide by ${A}.`;
    return{kind:"solve",skill:"solve",A,B,C,D,prompt:"Solve for x.",eqs:[disp],ans,steps,mistakes,hint};
  }
}
function genExpand(L){
  for(let t=0;t<200;t++){
    let m=1,n=1,p,q,special=null;
    if(L===0){p=ri(1,9);q=ri(1,9);}
    else if(L===1){const s=Math.random();if(s<.15){p=nz(-9,9);q=-p;special="diff";}else if(s<.3){p=nz(-9,9);q=p;special="square";}else{p=nz(-9,9);q=nz(-9,9);}}
    else{m=ri(1,5);n=ri(1,5);if(m===1&&n===1)continue;const s=Math.random();
      if(s<.15){n=m;p=nz(-9,9);q=-p;special="diff";}else if(s<.3){n=m;p=nz(-9,9);q=p;special="square";}else{p=nz(-9,9);q=nz(-9,9);}}
    const a=m*n,b=m*q+n*p,c=p*q,first=lin(m,p),second=lin(n,q);
    const disp=special==="square"?`(${first})²`:`(${first})(${second})`;
    const tl=(c0,v)=>poly([[c0,v]]),sg=c0=>(c0<0?M:"+")+Math.abs(c0);
    const area=`<table class="area"><tr><td>×</td><td>${tl(n,"x")}</td><td>${sg(q)}</td></tr><tr><td>${tl(m,"x")}</td><td>${tl(a,"x²")}</td><td>${tl(m*q,"x")}</td></tr><tr><td>${sg(p)}</td><td>${tl(n*p,"x")}</td><td>${tl(c,"")}</td></tr></table>`;
    const steps=[];
    if(special==="square")steps.push(["A bracket squared means multiply it by itself",`(${first})(${first})`]);
    steps.push(["Draw the area model and multiply each pair",area]);
    steps.push(["Collect the two x-terms on the diagonal",`${poly([[m*q,"x"],[n*p,"x"]])} = ${tl(b,"x")}`]);
    steps.push(["Write it in standard form, ax² + bx + c",poly([[a,"x²"],[b,"x"],[c,""]])]);
    return{kind:"expand",skill:"expand",prompt:"Expand and simplify into standard form.",eqs:[disp],a,b,c,m,n,p,q,special,steps,
      hint:`Draw a 2 × 2 area model. Put the terms of (${first}) down the side and the terms of (${special==="square"?first:second}) across the top. Multiply each pair, then add the two x-terms.`};
  }
}
function genComp(L){
  for(let t=0;t<500;t++){
    let m1,m2,b1,x0;
    if(L===0){m1=ri(1,6);m2=ri(1,6);x0=ri(1,8);b1=ri(0,12);}
    else if(L===1){m1=nz(-5,6);m2=nz(-5,6);x0=ri(-5,8);b1=nz(-15,15);}
    else{m1=nz(-8,9);m2=nz(-8,9);x0=nz(-9,9);b1=nz(-25,25);}
    if(m1===m2)continue;
    const y0=m1*x0+b1,b2=y0-m2*x0;
    if(L===0&&(b2<-10||b2>25||y0<0||y0>40))continue;
    if(Math.abs(y0)>(L===2?60:45))continue;
    if(L===1&&Math.abs(b2)>20)continue;if(L===2&&Math.abs(b2)>40)continue;if(b1===b2)continue;
    const r1=L>=1&&m1<0&&b1>0&&Math.random()<.45,r2=L>=1&&m2<0&&b2>0&&Math.random()<.45;
    const pk=compPack(m1,b1,m2,b2,x0,y0);
    return{kind:"poi",skill:"comp",prompt:"Find the point of intersection by comparison.",eqs:[yEq(m1,b1,r1),yEq(m2,b2,r2)],x0,y0,...pk,
      hint:`Both equations start with y =, so set the right sides equal: ${lin(m1,b1)} = ${lin(m2,b2)}. Solve that for x.`};
  }
}
function genSub(L){
  for(let t=0;t<800;t++){
    let x0,y0,A,B,m,b,xform=false;
    if(L===0){x0=ri(1,8);m=ri(1,3);b=ri(-3,8);y0=m*x0+b;if(y0<1)continue;A=ri(1,4);B=1;}
    else if(L===1){x0=ri(-4,8);m=nz(-3,4);b=nz(-8,8);y0=m*x0+b;A=nz(-4,7);B=pick([2,3,4,5,-1]);}
    else{xform=Math.random()<.35;x0=nz(-8,8);y0=nz(-8,8);m=nz(-4,4);A=nz(-6,8);B=pick([-2,-3,-4,-5,-6,3]);b=xform?x0-m*y0:y0-m*x0;}
    if(b===0&&L>0)continue;if(Math.abs(b)>15)continue;
    const C=A*x0+B*y0;if(Math.abs(C)>70)continue;
    const den=xform?A*m+B:A+B*m;if(den===0)continue;
    const pk=subPack(A,B,C,m,b,xform,x0,y0);
    return{kind:"poi",skill:"sub",prompt:"Find the point of intersection by substitution.",eqs:[`${poly([[A,"x"],[B,"y"]])} = ${sn(C)}`,xform?`x = ${lin(m,b,"y")}`:`y = ${lin(m,b)}`],x0,y0,xform,...pk,
      hint:xform?`② tells you what x equals. Replace the x in ① with (${lin(m,b,"y")}), solve for y, then find x.`:`② tells you what y equals. Replace the y in ① with (${lin(m,b)}), keep the brackets, then expand.`};
  }
}
/* word problems told as trail events */
function genStory(L){
  const kinds=L===0?["post","race","furs"]:["post","race","food","furs","packs"];
  for(let t=0;t<300;t++){
    const k=pick(kinds);let q;
    if(k==="post"){

/* ============ checking ============ */
function parse(s){
  if(s==null)return null;s=String(s).trim().replace(/[−–—]/g,"-").replace(/\s+/g,"").replace(/^[xy]=/i,"");
  if(s==="")return null;
  if(/^[-+]?\d+(\.\d+)?$/.test(s)||/^[-+]?\.\d+$/.test(s))return{v:parseFloat(s)};
  const m=s.match(/^([-+]?\d+)\/([-+]?\d+)$/);if(m&&+m[2]!==0)return{v:+m[1]/+m[2]};
  return{bad:true};
}
const near=(v,t)=>Math.abs(v-t)<0.006;
function check(q,vals){
  if(q.kind==="solve"){
    const r=parse(vals[0]);if(!r)return{s:"empty",msg:"Type a value for x first."};if(r.bad)return{s:"empty",msg:"Use a whole number, a fraction like 7/3, or a decimal like 2.33."};
    const t=fval(q.ans);
    if(isInt(q.ans)?r.v===t:near(r.v,t))return{s:"ok"};
    for(const mk of q.mistakes){if(fval(mk.val)!==t&&near(r.v,fval(mk.val)))return{s:"miss",msg:mk.msg}}
    return{s:"miss",msg:"Put your answer back into both sides. If they don't match, look for the step that went wrong."};
  }
  if(q.kind==="expand"){
    const vs=vals.map(parse);
    if(vs.some(v=>!v))return{s:"empty",msg:"Fill in all three boxes. Use 0 if a term is missing."};
    if(vs.some(v=>v.bad))return{s:"empty",msg:"Each box needs a number, like 3, -5 or 0."};
    const [a,b,c]=vs.map(v=>v.v);
    if(a===q.a&&b===q.b&&c===q.c)return{s:"ok"};
    if(a!==q.a)return{s:"miss",msg:`The x² term comes from ${poly([[q.m,"x"]])} × ${poly([[q.n,"x"]])}.`};
    if(c===q.c&&b!==q.b){
      if(q.special==="square"&&b===0)return{s:"miss",msg:"A squared bracket has two middle terms. Write it as two brackets."};
      if(b===q.m*q.q-q.n*q.p||b===-q.m*q.q+q.n*q.p)return{s:"miss",msg:"First and last terms are right. One of the two x-terms has the wrong sign."};
      return{s:"miss",msg:"First and last terms are right. Add the two x-terms on the diagonal, keeping their signs."};
    }
    if(c===-q.c)return{s:"miss",msg:`Check the sign of the last term: ${sn(q.p)} × ${sn(q.q)}.`};
    return{s:"miss",msg:"Some terms don't match. Draw the area model and check each box."};
  }
  const rx=parse(vals[0]),ry=parse(vals[1]);
  if(!rx||!ry)return{s:"empty",msg:"Fill in both boxes: an x-value and a y-value."};
  if(rx.bad||ry.bad)return{s:"empty",msg:"Each box needs a number, like 4 or -3."};
  if(rx.v===q.x0&&ry.v===q.y0)return{s:"ok"};
  if(rx.v===q.y0&&ry.v===q.x0&&q.x0!==q.y0)return{s:"miss",msg:"x and y look swapped. A point is always (x, y)."};
  const fv=q.xform?ry.v:rx.v,ft=q.xform?q.y0:q.x0,vn=q.xform?"y":"x";
  if(fv===ft)return{s:"miss",msg:`Your ${vn} is right. Substitute ${vn} = ${sn(ft)} into an equation to find ${vn==="x"?"y":"x"}.`};
  for(const mk of q.xm||[]){if(fval(mk.val)!==ft&&near(fv,fval(mk.val)))return{s:"miss",msg:mk.msg}}
  const w1=q.tests[0](rx.v,ry.v),w2=q.tests[1](rx.v,ry.v);
  if(w1&&!w2)return{s:"miss",msg:"Your point works in ① but not ②."};
  if(w2&&!w1)return{s:"miss",msg:"Your point works in ② but not ①."};
  return{s:"miss",msg:"Your point isn't on either line. Substitute it into both equations to check."};
}

      let html=`NOT QUITE. ${esc(r.msg)}<br><span class="orange">${line[0].replace("NAME",esc(crew()))}</span>`;
      try{spendDays(line[1],ctx.where);hurt(line[2],ctx.where);}catch(err){keyHandler=null;rej(err);return}
      if(attempts===2)html+=`<br><span class="yellow">HINT: ${q.hint}</span>`;
      fb("bad",html);
      if(attempts>=3){
        shown=true;
        document.getElementById("st").innerHTML=`<div class="steps"><span class="white">WORKED STEPS</span><ol>${q.steps.map(s=>`<li><span class="why">${s[0]}</span><br><span class="work">${s[1]}</span></li>`).join("")}</ol></div>`;
        finish(false);
      }else{ins[0].focus();ins[0].select()}
    });
  });
}

/* ============ events ============ */
const FLAVOUR=[
  ()=>({t:"A fair wind! You raise a blanket for a sail and make good time.",fn(){S.day=Math.max(0,S.day-1);S.food+=EAT}}),
  ()=>({t:"Wild blueberries on the shore. +20 lbs of food.",fn(){S.food+=20}}),
  ()=>({t:"Heavy rain. You wait it out under the canoe. Lose 1 day.",fn(){spendDays(1,"the rain")}}),
  ()=>({t:"Black flies! Everyone is miserable.",fn(){hurt(6,"black flies")}}),
  ()=>({t:`${esc(crew())} sings a paddling song. The crew feels better.`,fn(){S.health=Math.min(100,S.health+8)}}),
  ()=>({t:"The canoe scrapes a rock and springs a leak.",fn(){if(S.kits>0){S.kits--;this.t+=" You use 1 repair kit of birch bark and spruce gum."}else{this.t+=" With no repair kit, you lose 3 days patching it.";spendDays(3,"a leaking canoe")}}}),
  ()=>({t:`${esc(crew())} has a fever. You rest for a day.`,fn(){spendDays(1,"a fever");hurt(5,"a fever")}}),
  ()=>({t:"You meet Anishinaabe traders who share smoked fish. +25 lbs of food.",fn(){S.food+=25}})
];
async function flavourEvent(){
  const ev=pick(FLAVOUR)();ev.fn();renderStatus();
  await pressSpace(`<h2>${dateStr(S.day).toUpperCase()}</h2><p class="white">${ev.t}</p>`);
}

/* ============ flow ============ */
async function travel(fromKm,toKm,landKind,showLand){
  const dist=toKm-fromKm,days=Math.max(1,Math.round(dist/KMDAY));
  crtEl.classList.remove("q");main.innerHTML=`<p class="white">Paddling up the Ottawa River…</p><p class="dim">Press SPACE to skip ahead</p>`;
  keyHandler=e=>{if(e.key===" "){e.preventDefault();skipTravel=true}};
  const ms=reduce?400:2600;
  const t0=S.km,steps=days;
  const anim=animateTravel(ms,landKind,showLand);
  for(let d=1;d<=steps;d++){
    await new Promise(r=>setTimeout(r,skipTravel?0:ms/steps));
    S.km=t0+dist*d/steps;spendDays(1,"the river");
  }
  await anim;keyHandler=null;S.km=toKm;renderStatus();
}
async function landmark(i){
  const L=ROUTE[i];sfx.arrive();sceneLandmark=L.sprite;landX=170;drawScene(false);
  await pressSpace(`<h1>${L.name}</h1><p class="white center">${dateStr(S.day)}</p><p class="white">${L.blurb}</p><p class="yellow">${L.task}</p>`);
  const lvl=ROLES[S.role].level;
  const skills=L.skill==="mixed"?shuffle(["solve","expand","comp","sub"]):[L.skill,L.skill,L.skill];
  for(let k=0;k<skills.length;k++){
    const q=GEN[skills[k]](lvl);
    await ask(q,{header:`${L.name.toUpperCase()} · ${L.act} ${k+1} OF ${skills.length}${L.skill==="mixed"?" · "+SKILLNAME[skills[k]].toUpperCase():""}`,where:L.name});
  }
}
async function storyEvent(){
  const q=GEN.story(ROLES[S.role].level);
  await ask(q,{header:`${dateStr(S.day).toUpperCase()} · ${q.title}`,where:"the river"});
}
function score(){
  const r=ROLES[S.role];
  const parts=[["Questions right on the first try",S.first*100],["Crew health",S.health*2],["Food left (lbs)",Math.max(0,Math.round(S.food))],["Repair kits left",S.kits*20],["Money left",Math.round(S.money)]];
  const sub=parts.reduce((s,p)=>s+p[1],0);
  return{parts,sub,mult:r.mult,total:sub*r.mult};
}
function reportHTML(){
  const rows=Object.keys(S.stats).filter(k=>S.stats[k].a>0).map(k=>{const s=S.stats[k];const ok=s.f*3>=s.a*2;return `<tr><td>${SKILLNAME[k]}</td><td>${s.f} of ${s.a}</td><td class="${ok?"":"orange"}">${ok?"Ready":"Review this"}</td></tr>`}).join("");
  const weak=Object.keys(S.stats).filter(k=>S.stats[k].a>0&&S.stats[k].f*3<S.stats[k].a*2).map(k=>SKILLNAME[k]);
  return `<h2>TRAIL REPORT</h2><table class="report"><tr><th>Skill</th><th>First try</th><th></th></tr>${rows}</table>
    <p class="white">${weak.length?`Before the test, review: <span class="orange">${weak.join(", ")}</span>. Use the practice page and the worksheet for that lesson.`:"You got most questions on the first try in every skill. You're ready for the test."}</p>`;
}
async function titleScreen(){
  S=null;renderStatus();sceneLandmark="fort";landX=190;drawScene(false);
  for(;;){
    const c=await menu(`<h1>THE OTTAWA RIVER TRAIL</h1><p class="white center">A Unit 1 review: Lachine to Mattawa, 1826</p><p class="dim center">Solve equations, expand, and find points of intersection to get your brigade up the river.</p>`,
      [{key:"1",label:"Travel the trail",value:"go"},{key:"2",label:"Learn about the trail",value:"learn"},{key:"3",label:"How to type answers",value:"how"}]);
    if(c==="go")return;
    if(c==="learn")await pressSpace(`<h2>THE TRAIL</h2><p class="white">You lead a canoe brigade of 5 people up the Ottawa River, about 485 km. Each landmark is a lesson from Unit 1:</p>
      <p class="white">Long Sault Rapids — solving for x (L1)<br>Chaudière Falls — expanding (L2)<br>Chats Falls — comparison (L3)<br>Allumette Island — substitution (L4)<br>Mattawa — a mixed final stretch before the test</p>
      <p class="white">Between landmarks you'll meet word problems on the river. A wrong answer costs a day of food and some crew health. After a 2nd miss you get a hint; after a 3rd you see the worked steps.</p>`);
    if(c==="how")await pressSpace(`<h2>TYPING ANSWERS</h2><p class="white">Type numbers in the yellow boxes and press ENTER. Use TAB to move between boxes.</p>
      <p class="white">Negatives: <span class="yellow">-3</span> · Fractions: <span class="yellow">7/3</span> · Decimals: <span class="yellow">2.33</span> (round to 2 places)</p>
      <p class="white">Points of intersection go in two boxes: <span class="yellow">( 4 , -2 )</span>. Expanding goes in three: <span class="yellow">2</span> x² + <span class="yellow">-9</span> x + <span class="yellow">-5</span>. Use 0 for a missing term.</p>
      <p class="white">Press M at any time to turn sound on or off.</p>`);
  }
}
async function setup(){
  S=freshState();
  S.mode=await menu(`<h2>CHOOSE YOUR TRIP</h2>`,[
    {key:"1",label:`Brigade mode <span class="dim">— run out of food or health and your trip ends</span>`,value:"brigade"},
    {key:"2",label:`Practice paddle <span class="dim">— everyone reaches Mattawa</span>`,value:"practice"}]);
  S.role=await menu(`<h2>MANY KINDS OF PEOPLE TRAVELLED THE OTTAWA RIVER. YOU MAY:</h2>`,ROLES.map((r,i)=>({key:String(i+1),label:`Be a ${r.name.toLowerCase()} <span class="dim">— ${r.desc}</span>`,value:i})));
  const r=ROLES[S.role];S.money=r.money;
  const defs=shuffle(DEFAULT_NAMES.slice()).slice(0,5);
  main.innerHTML=`<h2>NAME YOUR BRIGADE</h2><p class="dim">Names stay on this screen only. Nothing is saved.</p>
    <form id="nf" class="menu" autocomplete="off">${[0,1,2,3,4].map(i=>`<label class="row"><span style="min-width:7em" class="white">${i?"Paddler "+i:"Your name"}:</span><input class="name" id="n${i}" maxlength="12" value="${esc(defs[i])}" spellcheck="false"></label>`).join("")}
    <p><button class="btn" type="submit"><span class="k">ENTER</span> = these are my paddlers</button></p></form>`;
  document.getElementById("n0").focus();document.getElementById("n0").select();
  await new Promise(res=>{document.getElementById("nf").addEventListener("submit",e=>{e.preventDefault();S.names=[0,1,2,3,4].map(i=>(document.getElementById("n"+i).value.trim()||defs[i]).slice(0,12));res()})});
  // store
  let food=r.food,kits=r.kits;
  await new Promise(res=>{
    const draw=()=>{const cost=food*FOOD_PRICE+kits*KIT_PRICE;
      main.innerHTML=`<h2>THE GENERAL STORE AT LACHINE</h2><p class="white">You have <span class="yellow">$${r.money}</span>. Your crew eats about ${EAT} lbs a day, and the trip takes about 2 weeks. Wrong answers cost extra days.</p>
      <table class="store"><tr><td>Food (20¢ a lb)</td><td><button id="f-" aria-label="less food">−</button> <span class="yellow">${food} lbs</span> <button id="f+" aria-label="more food">+</button></td><td>$${(food*FOOD_PRICE).toFixed(0)}</td></tr>
      <tr><td>Repair kits ($${KIT_PRICE} each)</td><td><button id="k-" aria-label="fewer kits">−</button> <span class="yellow">${kits}</span> <button id="k+" aria-label="more kits">+</button></td><td>$${kits*KIT_PRICE}</td></tr>
      <tr><td>Total</td><td></td><td class="${cost>r.money?"red":"yellow"}">$${cost.toFixed(0)}</td></tr></table>
      <p class="dim">F / G = more or less food · K / J = more or fewer kits</p>
      <p><button class="btn" id="buy" ${cost>r.money?"disabled":""}><span class="k">ENTER</span> = buy and leave Lachine</button></p>`;
      const can=(df,dk)=>food+df>=0&&kits+dk>=0&&(food+df)*FOOD_PRICE+(kits+dk)*KIT_PRICE<=r.money;
      const ch=(df,dk)=>{if(can(df,dk)){food+=df;kits+=dk;sfx.key();draw();const b=document.getElementById(df>0?"f+":df<0?"f-":dk>0?"k+":"k-");b&&b.focus()}};
      document.getElementById("f-").onclick=()=>ch(-50,0);document.getElementById("f+").onclick=()=>ch(50,0);
      document.getElementById("k-").onclick=()=>ch(0,-1);document.getElementById("k+").onclick=()=>ch(0,1);
      document.getElementById("buy").onclick=()=>{keyHandler=null;res()};
      keyHandler=e=>{const k=e.key.toLowerCase();if(k==="f")ch(50,0);else if(k==="g")ch(-50,0);else if(k==="k")ch(0,1);else if(k==="j")ch(0,-1);else if(k==="enter"&&e.target.tagName!=="BUTTON"){keyHandler=null;res()}};
      if(!document.activeElement||document.activeElement===document.body)document.getElementById("buy").focus();
    };draw();
  });
  S.food=food;S.kits=kits;S.money-=food*FOOD_PRICE+kits*KIT_PRICE;renderStatus();
  await pressSpace(`<h1>LACHINE</h1><p class="white center">${dateStr(0)}</p><p class="white">${ROUTE[0].blurb}</p><p class="white">${esc(S.names[0])}, your brigade is ready: ${S.names.slice(1).map(esc).join(", ")}.</p>`,"Press SPACE BAR to push off");
}
async function journey(){
  for(let i=1;i<ROUTE.length;i++){
    const a=ROUTE[i-1].km,b=ROUTE[i].km,mid=Math.round((a+b)/2);
    await travel(a,mid,ROUTE[i].sprite,false);
    if(Math.random()<.6)await flavourEvent();
    if(i<ROUTE.length-1||Math.random()<.5)await storyEvent(); else await flavourEvent();
    await travel(mid,b,ROUTE[i].sprite,true);
    await landmark(i);
  }
}
async function win(){
  sfx.arrive();sceneLandmark="fort";landX=170;drawScene(false);
  const sc=score();
  await pressSpace(`<h1>YOU MADE IT TO MATTAWA!</h1><p class="white center">${dateStr(S.day)} · ${S.day} days on the river</p>
    <p class="white">Congratulations, ${esc(S.names[0])}! Your brigade reached Mattawa${S.mode==="practice"&&S.bonusFood?` (with help from ${S.bonusFood} passing brigade${S.bonusFood>1?"s":""} that shared food)`:""}.</p>
    <table class="report">${sc.parts.map(p=>`<tr><td>${p[0]}</td><td class="yellow">${p[1]}</td></tr>`).join("")}<tr><td>Bonus for being a ${ROLES[S.role].name.toLowerCase()}</td><td class="yellow">×${sc.mult}</td></tr><tr><td class="white">TOTAL POINTS</td><td class="orange">${sc.total}</td></tr></table>`,"Press SPACE BAR for your trail report");
}
async function lose(err){
  sfx.bad();
  const cause=pick(DEATHS);
  const where=S.km>=ROUTE[ROUTE.length-1].km?"Mattawa":`km ${Math.round(S.km)}`;
  await pressSpace(`<h1>YOUR BRIGADE IS STRANDED</h1><p class="white center">${dateStr(S.day)} · ${where}</p>
    <p class="white">${err.cause.why==="food"?"The food has run out.":"The crew is too exhausted to paddle."}</p>
    <p class="orange center" style="font-size:30px">You have died of ${cause}.</p>`);
  main.innerHTML=`<div class="tomb"><p>HERE LIES</p><p class="yellow" style="font-size:30px">${esc(S.names[0])}’s brigade</p><p class="dim">${dateStr(S.day)}</p><p style="margin-top:10px">Epitaph:</p><input id="ep" class="name" maxlength="24" aria-label="Epitaph" value="" placeholder="check your signs"><p class="dim" style="font-size:18px">Not saved anywhere.</p></div>`;
  document.getElementById("ep").focus();
  await new Promise(res=>{keyHandler=e=>{if(e.key==="Enter"){e.preventDefault();keyHandler=null;res()}};document.getElementById("ep").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();keyHandler=null;res()}})});
}
async function run(){
  let skipTitle=false;
  for(;;){
    if(!skipTitle)await titleScreen();
    skipTitle=false;
    await setup();
    let ok=true;
    try{await journey();}catch(err){if(err instanceof GameOver){ok=false;await lose(err)}else throw err}
    if(ok)await win();
    const again=await menu(reportHTML(),[{key:"1",label:"Travel the trail again",value:1},{key:"2",label:"Back to the title screen",value:2}]);
    if(again===1){skipTitle=true;sceneLandmark="fort";landX=190;drawScene(false);}
  }
}
drawScene(false);
setInterval(()=>{if(!document.hidden&&!travelling()){sceneT++;drawScene(false)}},250);
function travelling(){return main.textContent.startsWith("Paddling")}
run();
})();
</script>
