<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A 16-bit survey-adventure review game for Grade 10 Unit 2 math, along the Rideau from Bytown to Kingston in 1827.">
<meta name="robots" content="noindex">
<title>Bytown Surveyor</title>
<style>
:root{color-scheme:dark}
@font-face{font-family:"Atkinson Hyperlegible";src:url("../fonts/atkinson-400.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url("../fonts/atkinson-700.woff") format("woff");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url("../fonts/atkinson-400-italic.woff") format("woff");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Press Start 2P";src:url("../fonts/press-start-2p.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>
<style>
/* Layout: a 16-bit console game. HUD strip, top-down map canvas with RPG windows layered over it
   (dialog box at the bottom, question window over the map), touch pad underneath.
   Deliberately single-theme: a console screen looks the same on a light or dark host. */
:root{
  --night:#0b1024; --frame:#1a2244; --win1:#2a46a0; --win2:#14225e; --edge:#f5f0dc; --ink:#f5f0dc;
  --gold:#ffd34d; --sky:#7ee8ff; --red:#ff6b6b; --green:#8dff7a; --dim:#a9b8e6; --shadow:#060a1c;
  --f-title:"Press Start 2P", "Courier New", monospace;
  --f-body:"Atkinson Hyperlegible", "Verdana", "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.35}
.wrap{min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding-inline:16px;padding-block:12px}
.console{width:100%;max-width:980px;display:flex;flex-direction:column;gap:8px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:2px 18px;padding:6px 12px;background:var(--frame);border:3px solid var(--edge);border-radius:6px;box-shadow:0 0 0 3px var(--shadow);font-size:18px}
.hud b{color:var(--gold);font-weight:700}
.hud .ttl{font-family:var(--f-title);font-size:10px;color:var(--sky);letter-spacing:.06em;margin-right:auto}
.hud button{font:inherit;font-size:16px;background:none;border:2px solid var(--dim);color:var(--ink);padding:0 8px;border-radius:4px;cursor:pointer;white-space:nowrap}
.hud button:focus-visible{outline:2px solid var(--gold)}
.trail{display:flex;align-items:center;gap:6px;width:100%;font-size:15px;color:var(--dim)}
.trail .bar{position:relative;flex:1;height:6px;background:#2a3566;border-radius:3px}
.trail .fill{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:3px}
.trail .stop{position:absolute;top:-3px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#2a3566;border:2px solid var(--dim)}
.trail .stop.done{background:var(--green);border-color:var(--green)}
.screen{position:relative;border:3px solid var(--edge);border-radius:6px;box-shadow:0 0 0 3px var(--shadow);overflow:hidden;background:#000;aspect-ratio:320/208}
#map{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.win{background:linear-gradient(180deg,var(--win1),var(--win2));border:3px solid var(--edge);border-radius:8px;box-shadow:0 0 0 3px var(--shadow),inset 0 0 0 2px #3b5bc4;color:var(--ink)}
#dialog{position:absolute;left:3%;right:3%;bottom:4%;padding:12px 18px 14px;min-height:28%;font-size:clamp(16px,2.3vw,22px)}
#dialog .who{position:absolute;top:-16px;left:14px;font-family:var(--f-title);font-size:10px;background:var(--win2);border:3px solid var(--edge);border-radius:6px;padding:5px 8px;color:var(--gold)}
#dialog .more{position:absolute;right:12px;bottom:6px;color:var(--gold);font-size:14px}
#banner{position:absolute;left:50%;top:8%;transform:translateX(-50%);font-family:var(--f-title);font-size:clamp(12px,2.4vw,22px);padding:12px 18px;text-align:center;white-space:nowrap;transition:opacity .6s}
#banner small{display:block;font-family:var(--f-body);font-size:.75em;color:var(--dim);margin-top:6px}
#panel{position:absolute;inset:3%;padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:10px}
#panel.title{inset:9% 22%}
#say{max-height:7.4em;overflow-y:auto}
h1{font-family:var(--f-title);font-size:clamp(18px,3.4vw,32px);color:var(--gold);margin:6px 0 2px;line-height:1.4;text-align:center;text-shadow:3px 3px 0 var(--shadow);text-wrap:balance}
h2{font-family:var(--f-body);font-weight:700;font-size:15px;color:var(--sky);margin:0;line-height:1.4;letter-spacing:.08em;text-transform:uppercase}
p{margin:0}
.gold{color:var(--gold)} .sky{color:var(--sky)} .red{color:var(--red)} .green{color:var(--green)} .dim{color:var(--dim)} .center{text-align:center}
.hl{color:var(--gold)}
.small{font-size:17px}
.menu{display:flex;flex-direction:column;gap:4px}
.menu button,.btn{font:inherit;text-align:left;background:none;border:none;color:var(--ink);padding:3px 8px 3px 26px;cursor:pointer;position:relative;border-radius:4px}
.menu button::before,.btn::before{content:"▶";position:absolute;left:6px;color:var(--gold);opacity:0;font-size:.8em;top:.25em}
.menu button:hover,.menu button:focus-visible,.btn:hover,.btn:focus-visible{background:rgba(255,255,255,.08);outline:none}
.menu button:hover::before,.menu button:focus-visible::before,.btn:hover::before,.btn:focus-visible::before{opacity:1}
.k{color:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:12px 20px;align-items:start}
.qwrap.nofig{grid-template-columns:minmax(0,1fr)}
.qtext{display:flex;flex-direction:column;gap:10px;min-width:0}
.figwrap{display:flex;flex-direction:column;gap:4px;min-width:0}
#fig{display:block;width:100%;height:auto;border:3px solid var(--edge);border-radius:4px;background:#0f1d4a;touch-action:manipulation}
#fig.click{cursor:crosshair}
#fig:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.big{font-size:26px}
.answer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:24px}
.answer .lbl{color:var(--sky)}
input{font:inherit;font-size:24px;width:4.6em;background:#0a1238;color:var(--gold);border:3px solid var(--edge);border-radius:4px;padding:0 6px;text-align:center}
input:focus{outline:none;border-color:var(--gold)}
input.name{width:9em;text-align:left}
input.wide{width:min(11em,100%);text-align:left;letter-spacing:.02em}
.keys{display:inline-flex;gap:6px}
.key{font:inherit;font-weight:700;font-size:20px;min-width:2.1em;padding:0 8px;background:var(--win2);color:var(--gold);border:3px solid var(--edge);border-radius:6px;cursor:pointer}
.key:hover,.key:focus-visible{border-color:var(--gold);outline:none}
.preview{font-size:17px;color:var(--dim);min-height:1.3em}
.choices{display:flex;flex-direction:column;gap:5px}
.opt{font:inherit;font-size:22px;text-align:left;background:rgba(10,18,56,.6);border:3px solid #6f85d0;border-radius:6px;color:var(--ink);padding:3px 10px;cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:var(--gold);outline:none}
.opt:disabled{opacity:.35;cursor:default;text-decoration:line-through}
.opt.right{border-color:var(--green);color:var(--green);opacity:1;text-decoration:none}
.msg{padding:6px 10px;border:3px solid currentColor;border-radius:6px;background:rgba(6,10,28,.45)}
.msg.good{color:var(--green)} .msg.bad{color:var(--red)} .msg.hint{color:var(--gold)}
.msg .ink{color:var(--ink)}
.steps{border:3px dashed #6f85d0;border-radius:6px;padding:6px 12px}
.steps ol{margin:4px 0 0;padding-left:1.6em;display:flex;flex-direction:column;gap:3px}
.steps .why{color:var(--dim)} .steps .work{color:var(--gold)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.78em;line-height:.95;text-align:center;margin:0 .08em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .12em}
table.box,table.tbl{border-collapse:collapse;color:var(--gold);margin:3px 0;font-variant-numeric:tabular-nums}
table.box td{padding:0 12px;text-align:center}
table.box tr:first-child td{border-bottom:2px solid var(--gold)}
table.box td:first-child{border-right:2px solid var(--gold)}
table.tbl th{color:var(--dim);font-weight:400;text-align:left;padding:0 16px 0 0}
table.tbl td{padding:0 16px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.store td{padding:2px 12px 2px 0}
.store button{font:inherit;background:none;border:2px solid var(--edge);color:var(--ink);min-width:2em;border-radius:4px;cursor:pointer}
.store button:focus-visible{outline:2px solid var(--gold)}
.report{border-collapse:collapse}
.report td,.report th{padding:1px 14px 1px 0;text-align:left;font-weight:400}
.report th{color:var(--dim)}
.stone{border:4px solid var(--edge);border-radius:70px 70px 6px 6px;padding:24px 18px 14px;max-width:440px;margin:4px auto;text-align:center;background:#3a3f55}
.pad{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:2px 4px;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,40px);gap:4px}
.pad button{font-family:var(--f-title);font-size:14px;background:var(--frame);color:var(--ink);border:3px solid var(--edge);border-radius:8px;cursor:pointer;touch-action:none}
.pad button:active{background:var(--win1)}
.pad .abtn{width:64px;height:64px;border-radius:50%;background:#7a2a3a}
.pad .btns{display:flex;align-items:center;gap:10px}
.pad .rbtn{width:44px;height:44px;border-radius:50%;background:#2a4a3a;font-size:12px}
.pad .tip{flex:1;text-align:center;color:var(--dim);font-size:16px}
@media (max-width:700px){
  body{font-size:18px}
  #panel,#panel.title{position:fixed;inset:0;border-radius:0;z-index:20;padding:14px 16px 24px}
  .qwrap{grid-template-columns:minmax(0,1fr)}
  .answer,input,.big{font-size:20px}.opt{font-size:19px}
  .pad .tip{display:none}
  .hud .ttl{display:none}
  .hud{font-size:15px}
  #dialog{position:fixed;left:8px;right:8px;bottom:12px;min-height:0;z-index:15;font-size:18px;padding-top:18px}
}
@media (prefers-reduced-motion:reduce){#banner{transition:none}}
</style>

<div class="wrap"><div class="console">
  <div class="hud" id="hud"><span class="ttl">BYTOWN SURVEYOR</span><span id="hudStats"></span><button id="soundBtn" type="button" aria-pressed="false">Sound: off</button><div class="trail" id="trail" hidden></div></div>
  <div class="screen" id="screen">
    <canvas id="map" width="320" height="208" aria-label="Map of the Rideau route. Use the arrow keys to walk."></canvas>
    <div id="banner" class="win" hidden></div>
    <div id="dialog" class="win" hidden aria-live="polite"><span class="who" id="who"></span><p id="say"></p><span class="more" id="more">▼</span></div>
    <div id="panel" class="win" hidden aria-live="polite"></div>
  </div>
  <div class="pad" id="pad">
    <div class="dpad"><span></span><button data-dir="up" aria-label="Walk up">▲</button><span></span><button data-dir="left" aria-label="Walk left">◀</button><button data-dir="down" aria-label="Walk down">▼</button><button data-dir="right" aria-label="Walk right">▶</button></div>
    <p class="tip">Arrow keys or WASD to walk · Walk into people to talk · SPACE to continue · R restarts a push puzzle · M for sound</p>
    <span class="btns"><button class="rbtn" id="rbtn" aria-label="Start a push puzzle over">R</button><button class="abtn" id="abtn" aria-label="Talk or continue">A</button></span>
  </div>
</div></div>
<script>
(function(){
"use strict";
/* =================== math helpers =================== */
const M="−";
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nz=(a,b)=>{let v;do{v=ri(a,b)}while(v===0);return v};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const sn=n=>n<0?M+Math.abs(n):String(n);
function F(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}}
const fv=x=>typeof x==="number"?x:x.n/x.d;
const fneg=x=>typeof x==="number"?-x:F(-x.n,x.d);
const fa=x=>typeof x==="number"?String(x):(x.d===1?String(x.n):x.n+"/"+x.d);
function fh(x){if(typeof x==="number")return sn(x);if(x.d===1)return sn(x.n);return `${x.n<0?M:""}<span class="fr"><span>${Math.abs(x.n)}</span><span>${x.d}</span></span>`}
function cxv(c,v="x"){const val=fv(c);if(val===1)return v;if(val===-1)return M+v;return fh(c)+v}
function lineH(m,b){
  const mv=fv(m),bv=fv(b);let s="y = ";
  if(mv!==0){s+=cxv(m);if(bv>0)s+=" + "+fh(b);else if(bv<0)s+=" "+M+" "+fh(fneg(b));}
  else s+=fh(b);
  return s;
}
const SUP=["","","²","³","⁴"];
const xp=p=>p===0?"":p===1?"x":"x"+SUP[p];
function poly(ts){let s="";for(const [c,p] of ts){if(c===0)continue;const a=Math.abs(c);const body=p===0?String(a):(a===1?"":a)+xp(p);s+=s===""?(c<0?M:"")+body:(c<0?" "+M+" ":" + ")+body}return s||"0"}
const bin=p=>`(x ${p<0?M:"+"} ${Math.abs(p)})`;
const sg=n=>(n<0?M:"+")+Math.abs(n);
function primes(n){n=Math.abs(n);const out=[];for(let p=2;p*p<=n;p++)while(n%p===0){out.push(p);n/=p}if(n>1)out.push(n);return out}
function rad(n){let k=1,r=n;for(let i=Math.floor(Math.sqrt(n));i>1;i--){if(n%(i*i)===0){k=i;r=n/(i*i);break}}return{k,r}}
function radH(n){const {k,r}=rad(n);if(r===1)return String(k);if(k===1)return `√${n}`;return `√${n} = ${k}√${r}`}
const isSq=n=>Number.isInteger(Math.sqrt(n));
const TBL=(rows,head)=>`<table class="tbl">${head?`<tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>`:""}${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
const P=(x,y)=>`(${sn(x)}, ${sn(y)})`;
function side(Pp,Qq){const dx=Qq[0]-Pp[0],dy=Qq[1]-Pp[1];return{dx,dy,m:F(dy,dx),n:dx*dx+dy*dy}}
const dot=(a,b)=>a.dx*b.dx+a.dy*b.dy, cross=(a,b)=>a.dx*b.dy-a.dy*b.dx;
const inBox=(pts,lo,hi)=>pts.every(p=>p[0]>=lo&&p[0]<=hi&&p[1]>=lo&&p[1]<=hi);
function fitBox(pts,lo,hi){
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys);
  if(w>hi-lo||h>hi-lo)return null;
  const ox=ri(lo,hi-w)-Math.min(...xs),oy=ri(lo,hi-h)-Math.min(...ys);
  return pts.map(p=>[p[0]+ox,p[1]+oy]);
}
function boxH(p,q,k){/* box method table for (x+p)(x+q), optional leading factor shown outside */
  return `${k&&k!==1?`<span class="yellow">${k===-1?M:sn(k)}</span>`:""}<table class="box" style="display:inline-table;vertical-align:middle"><tr><td>×</td><td>x</td><td>${sg(q)}</td></tr><tr><td>x</td><td>x²</td><td>${poly([[q,1]])}</td></tr><tr><td>${sg(p)}</td><td>${poly([[p,1]])}</td><td>${sn(p*q)}</td></tr></table>`;
}
function expand(k,a1,b1,a2,b2){return[k*a1*a2,k*(a1*b2+b1*a2),k*b1*b2]}
const triStr=c=>poly([[c[0],2],[c[1],1],[c[2],0]]);
function toCo(ts){const a=[];for(const [c,p] of ts)a[p]=(a[p]||0)+c;for(let i=0;i<a.length;i++)a[i]=a[i]||0;return a}
function radS(n){const {k,r}=rad(n);return r===1?String(k):k===1?`√${n}`:`${k}√${r}`}

/* =================== question generators =================== */
/* Each returns {skill, text, fig?, ans:{type,...}, steps, hint, mistakes?, fieldMsg?, missFn?} */
const LINEF=[{pre:"y =",post:"x +",label:"slope m"},{label:"y-intercept b"}];

function genLine(L){
  for(let t=0;t<500;t++){
    const type=pick(L===0?["graph","graph","slopept","twopts"]:["graph","slopept","twopts","twopts"]);
    let m;
    if(L===0)m=F(pick([1,2,3,-1,-2]));
    else if(L===1)m=pick([F(nz(-4,4)),F(pick([1,-1]),2),F(pick([1,2,-1,-2]),3),F(pick([3,-3]),2)]);
    else m=pick([F(pick([2,-2,1,-1]),pick([3,5])),F(pick([3,-3,1,-1]),4),F(pick([3,5,-3,-5]),2),F(nz(-5,5))]);
    const d=m.d;let q;
    if(type==="graph"){
      const b=ri(-4,4),dir=(L>0&&Math.random()<.4)?-1:1;
      const k=d===1?(Math.abs(m.n)>=3?1:pick([1,2])):1;
      const x2=dir*d*k,y2=b+dir*m.n*k;
      if(Math.abs(x2)>6||Math.abs(y2)>6)continue;
      const rise=y2-b,run=x2;
      q={text:`<p>The engineers drew the line of the new dam on the survey plan. Write its equation.</p>`,
        fig:{type:"grid",min:-6,max:6,lines:[{m:fv(m),b}],pts:[{x:0,y:b},{x:x2,y:y2}]},
        steps:[["Pick two points where the line crosses the grid exactly",`(0, ${sn(b)}) and ${P(x2,y2)}`],["Count the rise and the run",`rise = ${sn(rise)}, run = ${sn(run)}`],["Slope = rise ÷ run",`m = ${sn(rise)}/${sn(run)} = ${fh(m)}`],["Read b where the line crosses the y-axis",`b = ${sn(b)}`],["Write the equation",`∴ ${lineH(m,b)}`]],
        hint:`Start at (0, ${sn(b)}) and count to the other marked point: how far up or down (rise), and how far across (run)?`,
        vals:[m,b]};
    }else if(type==="slopept"){
      const x1=L===0?ri(1,6):d*nz(-3,3),y1=L===0?ri(1,15):ri(-9,12);
      const mx=m.n*x1/d,b=y1-mx;
      if(!Number.isInteger(b)||Math.abs(b)>25)continue;
      q={text:`<p>A lot boundary has a slope of <span class="hl">${fh(m)}</span> and passes through the survey stake at <span class="hl">${P(x1,y1)}</span>. Write the equation of the boundary.</p>`,
        steps:[[`Put m = ${fh(m)} into y = mx + b`,`y = ${cxv(m)} + b`],[`Sub ${P(x1,y1)} to get b`,`${sn(y1)} = ${fh(m)}(${sn(x1)}) + b`],["Multiply",`${sn(y1)} = ${sn(mx)} + b`],[`${mx>=0?"Subtract":"Add"} ${Math.abs(mx)} ${mx>=0?"from":"to"} both sides`,`${sn(b)} = b`],["Write the equation",`∴ ${lineH(m,b)}`]],
        hint:`Write y = ${cxv(m)} + b, then replace x with ${sn(x1)} and y with ${sn(y1)} and solve for b.`,
        vals:[m,b],mistakes:y1+mx!==b?[{f:1,val:y1+mx,msg:`When ${sn(mx)} moves across the equals sign, it changes sign. Check that step.`}]:[]};
    }else{
      const sgn=(L>0&&Math.random()<.4)?-1:1,k=pick([1,2]);
      const x1=L===0?ri(0,5):d*ri(-3,3),y1=L===0?ri(0,8):ri(-8,8);
      const run=sgn*d*k,rise=sgn*m.n*k,x2=x1+run,y2=y1+rise;
      if(L===0&&(x2<0||y2<0||y2>20))continue;
      if(Math.abs(x2)>12||Math.abs(y2)>20)continue;
      const b=y1-m.n*x1/d;if(!Number.isInteger(b)||Math.abs(b)>25)continue;
      const mx=m.n*x1/d;
      const mistakes=[];
      if(rise!==0&&fv(F(run,rise))!==fv(m))mistakes.push({f:0,val:F(run,rise),msg:"Slope is rise over run: the change in y goes on top."});
      mistakes.push({f:0,val:fneg(m),msg:"Check the sign of the slope. Subtract the coordinates in the same order on the top and the bottom."});
      q={text:`<p>The towpath runs straight from stake A${P(x1,y1)} to stake B${P(x2,y2)}. Write the equation of its line.</p>`,

/* The route winds: each stretch between stations has a horizontal run (with an obstacle zone),
   a detour up or down, and a run into the next station. The river follows the road's lower side. */
const T=16,VW=20,VH=13,WH=28,SEG=46;
const YS=[12,12,17,10,15,19,12,9,14],YM=[0,8,21,7,20,8,8,18,21];
ROUTE.forEach((s,i)=>{s.x=10+i*SEG;s.y=YS[i]});
const WW=ROUTE[ROUTE.length-1].x+14;
const TL={G:0,TREE:1,FOREST:2,ROAD:3,SAND:4,WATER:5,FOAM:6,BRIDGE:7,FENCE:8,GATEC:9,GATEO:10,ROCK:11,CLIFF:12,STONE:13,FLOWER:14,
  BRUSH:15,MUD:16,SWAMP:17,CHUTE:18,DOCK:19,GRAVEL:20,LOGB:21,BERRY:22,STEP:23,REEDS:24};
const SOLID=new Set([1,2,5,6,8,9,11,12,13,17,22]);
let tiles,blocked,buildings,npcs,objs,stones,ferry=null;
const hsh=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0};
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const tAt=(x,y)=>x<0||y<0||x>=WW||y>=WH?TL.FOREST:tiles[y*WW+x];
const setT=(x,y,v)=>{if(x>=0&&y>=0&&x<WW&&y<WH)tiles[y*WW+x]=v};
function addB(x,y,w,h,kind){buildings.push({x,y,w,h,kind});for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)blocked[j*WW+i]=1}
const segA=i=>ROUTE[i-1].x+3;
const creekX=i=>ROUTE[i].x-14;
const eventX=i=>segA(i)+20;

/* ---- obstacle zones (one per stretch) ---- */
const ZKIND=[null,"rocks","logs","swamp","bridge","bear","ferry","blast","stones"];
const ZNAME={rocks:"ROCK SLIDE",logs:"TIMBER SLIDE",swamp:"CEDAR SWAMP",bridge:"WASHED-OUT BRIDGE",bear:"BLUEBERRY PATCH",ferry:"BIG RIDEAU LAKE",blast:"BLASTING CREW",stones:"CATARAQUI RAPIDS"};
const ZTIP={rocks:"Walk into a boulder to push it. Press R to start over.",logs:"Timber is coming down the slides. Cross between the logs.",swamp:"Mosquito swarms! Slip past them.",bridge:"The bridge washed out. Push a log into the creek. Press R to start over.",bear:"A black bear is eating berries. Sneak by on the far side.",ferry:"Walk into the ferryman to cross the lake.",blast:"Stand clear of the red marks!",stones:"Wobbly stones sink if you stop on them. Keep moving!"};
const ZHIT={logs:["WHACK!","A log knocks you back."],swamp:["BZZZZ!","The mosquitoes drive you back."],bear:["GRRR!","The bear chases you back."],blast:["BOOM!","The blast throws you back."],stones:["SPLASH!","You fall in and swim back."]};
const PUZ={
  rocks:["############","###..#..####","....o.o.....","###..#..####","############"],
  bridge:["##...#w#####","#.L..#w.####","....#.w.....","#..L..w..###","###...w#####"],
  swamp:["mmSSmmmrSSmm","mmmmmrmmmmmm","mmmmmmmmmmmm","mmrmmmmmmrmm","SSmmmSSmmmSS"],
  stones:["~~~~~~~~~~~~","~~~WWWS~~~~~",".WWS~~WWS~S.","~~~WW~~~WWW~","~~~~~~~~~~~~"]};
function zone(i){const A=segA(i),y0=YS[i-1];return{i,kind:ZKIND[i],A,x0:A+4,x1:A+15,y0,top:y0-2,bot:y0+2}}
const inZone=(z,x,y)=>x>=z.x0-1&&x<=z.x1&&y>=z.top&&y<=z.bot;
const BEAR_LOOP=(()=>{const p=[];for(let c=2;c<9;c++)p.push([c,0]);for(let r=0;r<4;r++)p.push([9,r]);for(let c=9;c>2;c--)p.push([c,4]);for(let r=4;r>0;r--)p.push([2,r]);return p})();
const BLAST={cycle:4800,groups:[[2,3],[5,6],[8,9]],off:[0,1600,3200],warn:1100,boom:500};
function blastPhase(g,now){const t=((now-BLAST.off[g])%BLAST.cycle+BLAST.cycle)%BLAST.cycle;return t<BLAST.warn?"warn":t<BLAST.warn+BLAST.boom?"boom":null}
const LOGCH=[{c:3,spd:2.6,ph:0},{c:6,spd:3.4,ph:4},{c:9,spd:3,ph:9}];
function logTops(z,ch,now){const out=[];for(let k=0;k<2;k++){const y=z.top-3+((now/1000*ch.spd+ch.ph+7*k)%14);if(y<z.bot+1.5)out.push(y)}return out}
const SWARMS=[{c:3,w:2.2,ph:0},{c:6,w:1.7,ph:2},{c:9,w:2.6,ph:4}];
const swarmY=(z,s,now)=>z.top+2+2*Math.sin(now/1000*s.w+s.ph);
function bearPos(now){const L=BEAR_LOOP.length,f=(now/1000*3.2)%L,k=Math.floor(f),a=BEAR_LOOP[k],b=BEAR_LOOP[(k+1)%L],t=f-k;return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,b[0]-a[0]]}
function stoneSunk(s,now){return s.t>0&&now-s.t>=900&&now-s.t<2700}

function placePuzzle(z){
  const m=PUZ[z.kind];
  objs=objs.filter(o=>!(o.zone===z.i&&(o.kind==="rock"||o.kind==="log")));
  for(let r=0;r<5;r++)for(let c=0;c<12;c++){const x=z.x0+c,y=z.top+r,ch=m[r][c];
    if(ch==="#")setT(x,y,z.kind==="rocks"?TL.CLIFF:TL.FOREST);
    else if(ch==="w")setT(x,y,TL.WATER);
    else setT(x,y,r===2?TL.ROAD:TL.G);
    if(ch==="o")objs.push({kind:"rock",x,y,zone:z.i});
    if(ch==="L")objs.push({kind:"log",x,y,zone:z.i});}
}
function buildZone(i){
  const z=zone(i);
  if(z.kind==="rocks"||z.kind==="bridge")return placePuzzle(z);
  if(z.kind==="swamp"||z.kind==="stones"){const m=PUZ[z.kind];
    for(let r=0;r<5;r++)for(let c=0;c<12;c++){const x=z.x0+c,y=z.top+r,ch=m[r][c];
      const t={m:TL.MUD,S:TL.SWAMP,r:TL.REEDS,"~":TL.FOAM,W:TL.STEP,".":TL.G}[ch]??TL.G;setT(x,y,t);
      if(ch==="W"||(ch==="S"&&z.kind==="stones")){setT(x,y,TL.STEP);stones[x+","+y]={safe:ch==="S",t:0}}}
    return}
  if(z.kind==="logs"){for(const ch of LOGCH)for(let y=z.top;y<=z.bot;y++)setT(z.x0+ch.c,y,TL.CHUTE);return}
  if(z.kind==="bear"){for(let r=0;r<5;r++)for(let c=0;c<12;c++){const x=z.x0+c,y=z.top+r;setT(x,y,c>=3&&c<=8&&r>=1&&r<=3?TL.BERRY:(r===2&&(c<3||c>8))?TL.ROAD:TL.G)}return}
  if(z.kind==="blast"){for(let r=0;r<5;r++)for(let c=0;c<12;c++)setT(z.x0+c,z.top+r,r===2?TL.ROAD:TL.GRAVEL);for(let c=-1;c<=12;c++)if(tAt(z.x0+c,z.top-1)===TL.FOREST)setT(z.x0+c,z.top-1,TL.CLIFF);return}
  if(z.kind==="ferry"){for(let x=z.x0;x<=z.x1;x++)for(let y=z.y0-4;y<=z.y0+5;y++)setT(x,y,TL.WATER);setT(z.x0-1,z.y0,TL.DOCK);setT(z.x1+1,z.y0,TL.DOCK);
    npcs.push({x:z.x0,y:z.y0,dir:"right",look:"ferryman",name:"Ferryman",kind:"ferry",i});}
}
function clearZone(i){const z=zone(i);
  if(z.kind==="rocks")objs=objs.filter(o=>!(o.zone===i&&o.kind==="rock"));
  if(z.kind==="bridge"){objs=objs.filter(o=>!(o.zone===i&&o.kind==="log"));setT(z.x0+6,z.y0,TL.LOGB)}}
function resetPuzzle(i){const z=zone(i);placePuzzle(z);placePlayer(z.A+3,z.y0,"right");showBanner("START OVER","The rocks and logs are back where they began.")}

function buildWorld(){
  tiles=new Uint8Array(WW*WH).fill(TL.FOREST);blocked=new Uint8Array(WW*WH);buildings=[];npcs=[];objs=[];stones={};ferry=null;
  const way=[[1,YS[0]]];
  for(let i=1;i<ROUTE.length;i++){const A=segA(i);way.push([A+17,YS[i-1]],[A+17,YM[i]],[A+25,YM[i]],[A+25,YS[i]])}
  way.push([WW-4,YS[YS.length-1]]);
  const road=[];
  for(let k=1;k<way.length;k++){const [x0,y0]=way[k-1],[x1,y1]=way[k];const dx=Math.sign(x1-x0),dy=Math.sign(y1-y0);let x=x0,y=y0;road.push([x,y]);while(x!==x1||y!==y1){x+=dx;y+=dy;road.push([x,y])}}
  const onRoad=new Set(road.map(([x,y])=>x+","+y));
  for(const [x,y] of road)for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++)setT(x+i,y+j,TL.G);
  /* decoration on the corridor edges */
  const R=rng(1827),nearRoad=(x,y)=>{for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if(onRoad.has((x+i)+","+(y+j)))return true;return false};
  for(let y=0;y<WH;y++)for(let x=0;x<WW;x++)if(tAt(x,y)===TL.G&&!nearRoad(x,y)){const r=R();if(r<.2)setT(x,y,TL.TREE);else if(r<.24)setT(x,y,TL.ROCK);else if(r<.3)setT(x,y,TL.FLOWER)}
  else if(tAt(x,y)===TL.G&&R()<.05&&!onRoad.has(x+","+y))setT(x,y,TL.FLOWER);
  /* river */
  const lev=new Array(WW).fill(YS[0]);
  for(let k=1;k<way.length;k++){const [x0,y0]=way[k-1],[x1,y1]=way[k];if(y0===y1)for(let x=x0;x<=x1&&x<WW;x++)lev[x]=y0}
  for(let x=way[way.length-1][0];x<WW;x++)lev[x]=way[way.length-1][1];
  const RL=lev.slice();
  for(let k=1;k<way.length;k++){const [x0,y0]=way[k-1],[x1,y1]=way[k];if(x0===x1&&y0!==y1){if(y1<y0)for(let x=x0;x<=x0+2;x++)RL[x]=y0;else for(let x=x0-3;x<=x0-1;x++)RL[x]=y1}}
  for(let i=1;i<ROUTE.length;i++){const A=segA(i);if(YM[i]<Math.min(YS[i-1],YS[i])){for(let x=A+17;x<=A+21;x++)RL[x]=YS[i-1];for(let x=A+22;x<=A+24;x++)RL[x]=YS[i]}}
  for(let x=0;x<WW;x++){for(let y=RL[x]+3;y<=RL[x]+5;y++)setT(x,y,TL.WATER);
    if(x>0&&RL[x]!==RL[x-1])for(let y=Math.min(RL[x],RL[x-1])+3;y<=Math.max(RL[x],RL[x-1])+5;y++)setT(x,y,TL.WATER);
    const t2=tAt(x,RL[x]+2);if(t2===TL.G||t2===TL.FLOWER||t2===TL.TREE||t2===TL.ROCK)setT(x,RL[x]+2,TL.SAND)}
  for(const [x,y] of road)setT(x,y,TL.ROAD);
  /* stations */
  const clear=(x0,x1,y0,y1)=>{for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)setT(x,y,TL.G)};
  const foam=(x0,x1,y0,y1)=>{for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)if(tAt(x,y)===TL.WATER&&hsh(x,y)%3)setT(x,y,TL.FOAM)};
  ROUTE.forEach((s,i)=>{const sx=s.x,y=s.y,x0=i===0?0:sx-9,x1=i===0?15:i===ROUTE.length-1?WW-4:sx+1;
    clear(x0,x1,y-6,y+1);for(let x=x0;x<=x1;x++){setT(x,y,TL.ROAD);if(tAt(x,y+2)!==TL.WATER)setT(x,y+2,TL.SAND)}});
  const SX=i=>ROUTE[i].x,SY=i=>ROUTE[i].y;
  {const y=SY(0);addB(1,y-6,6,5,"fort");addB(7,y-5,3,3,"store");addB(12,y-4,2,2,"tent");addB(14,y-5,2,2,"tent")}
  {const sx=SX(1),y=SY(1);addB(sx-7,y-5,3,3,"cabin");foam(sx-4,sx+3,y+3,y+5);for(let yy=y+3;yy<=y+5;yy++)setT(sx+5,yy,TL.STONE);setT(sx-3,y-3,TL.ROCK);setT(sx-1,y-4,TL.ROCK)}
  {const sx=SX(2),y=SY(2);addB(sx-7,y-5,3,3,"stonehouse");for(let x=sx-5;x<=sx+1;x++){setT(x,y+3,TL.STONE);setT(x,y+5,TL.STONE)}setT(sx-5,y+4,TL.STONE);setT(sx+1,y+4,TL.STONE)}
  {const sx=SX(3),y=SY(3);addB(sx-9,y-6,3,3,"cabin");addB(sx-5,y-4,3,3,"office");for(let x=sx-9;x<=sx-6;x++)setT(x,y-2,TL.FLOWER)}
  {const sx=SX(4),y=SY(4);addB(sx-7,y-5,4,4,"mill");foam(sx-3,sx+1,y+3,y+4)}
  {const sx=SX(5),y=SY(5);addB(sx-8,y-4,3,3,"cabin");addB(sx-4,y-3,2,2,"tent");foam(sx-2,sx,y+3,y+5)}
  {const sx=SX(6),y=SY(6);addB(sx-8,y-4,3,3,"stonehouse");for(let x=sx-9;x<=sx+1;x++){setT(x,y-6,TL.CLIFF);if(x%2)setT(x,y-5,TL.CLIFF)}for(let yy=y+3;yy<=y+5;yy++)for(let x=sx-1;x<=sx+1;x++)setT(x,yy,TL.STONE)}

  cam.x=Math.round(Math.max(0,Math.min(WW*T-VW*T,tx)));cam.y=Math.round(Math.max(0,Math.min(WH*T-VH*T,ty)));
  const x0=Math.floor(cam.x/T),y0=Math.floor(cam.y/T);
  for(let y=y0;y<=y0+VH;y++)for(let x=x0;x<=x0+VW;x++)drawTile(tAt(x,y),x*T-cam.x,y*T-cam.y,x,y,time);
  for(const b of buildings)if(b.x*T-cam.x<VW*T+16&&(b.x+b.w)*T-cam.x>-16)drawBuilding(b,cam.x,cam.y,time);
  const vis=(x,y)=>x*T-cam.x>-2*T&&x*T-cam.x<(VW+2)*T&&y*T-cam.y>-3*T&&y*T-cam.y<(VH+2)*T;
  for(const o of objs){if(!vis(o.x,o.y))continue;const px=o.x*T-cam.x,py=o.y*T-cam.y;
    if(o.kind==="rock")drawBoulder(px,py);else if(o.kind==="log")drawLog(px,py,false);else if(o.kind==="tool")drawTool(px,py,time);else if(o.kind==="card")drawCard(px,py,time)}
  /* zone hazards that sit on the ground */
  for(let i=1;i<ROUTE.length;i++){const z=zone(i);if(!vis(z.x0,z.y0)&&!vis(z.x1,z.y0))continue;
    if(z.kind==="blast"){for(let c=-1;c<=12;c+=3){R_((z.x0+c)*T-cam.x+4,(z.top-1)*T-cam.y+6,8,9,"#5a3a1a");R_((z.x0+c)*T-cam.x+4,(z.top-1)*T-cam.y+8,8,1,"#2a1a0a");R_((z.x0+c)*T-cam.x+4,(z.top-1)*T-cam.y+12,8,1,"#2a1a0a")}
      BLAST.groups.forEach((gr,gi)=>{const ph=blastPhase(gi,now);if(!ph)return;for(const c of gr)for(let r=0;r<5;r++){const px=(z.x0+c)*T-cam.x,py=(z.top+r)*T-cam.y;
        if(ph==="warn"){if(blinkOn(time*2.2)){R_(px+3,py+3,2,2,"#e8413a");R_(px+5,py+5,2,2,"#e8413a");R_(px+7,py+7,2,2,"#e8413a");R_(px+9,py+9,2,2,"#e8413a");R_(px+11,py+11,2,2,"#e8413a");R_(px+11,py+3,2,2,"#e8413a");R_(px+9,py+5,2,2,"#e8413a");R_(px+5,py+9,2,2,"#e8413a");R_(px+3,py+11,2,2,"#e8413a")}}
        else{const k=(time/70|0)%3;R_(px+1-k,py+1-k,14+2*k,14+2*k,k%2?"#ffb24a":"#ffe066");R_(px+5,py+5,6,6,"#fff7c0")}}})}}
  const ppl=npcs.filter(n=>!n.hidden&&Math.abs(n.x*T-cam.x-VW*T/2)<VW*T).map(n=>({y:n.y*T,f:()=>{
    const nx=(n.fx??n.x)*T-cam.x,ny=n.y*T-cam.y;
    if(n.kind==="ferry"){drawBoat(nx,ny);drawPerson(nx-3,ny-2,n.look,n.dir,0);return}
    drawPerson(nx,ny,n.look,n.dir,0);
    if(n.kind==="station"&&!S?.done?.[n.i]&&n.i>0&&blinkOn(time)){R_(nx+6,ny-9,4,6,"#ffd34d");R_(nx+6,ny-2,4,2,"#ffd34d")}
    if(n.kind==="traveller"&&!S?.crossed?.[n.i]&&blinkOn(time)){R_(nx+6,ny-9,4,6,"#7ee8ff");R_(nx+6,ny-2,4,2,"#7ee8ff")}}}));
  for(let i=1;i<ROUTE.length;i++){const z=zone(i);if(!vis(z.x0,z.y0)&&!vis(z.x1,z.y0))continue;
    if(z.kind==="logs")for(const ch of LOGCH)for(const ly of logTops(z,ch,now))ppl.push({y:ly*T+T,f:()=>{g.save();g.beginPath();g.rect((z.x0+ch.c)*T-cam.x,(z.top-3)*T-cam.y,T,(z.bot-z.top+4)*T);g.clip();drawLog((z.x0+ch.c)*T-cam.x,ly*T-cam.y,true);g.restore()}});
    if(z.kind==="swamp")for(const s of SWARMS){const sy=swarmY(z,s,now);ppl.push({y:sy*T+T,f:()=>drawSwarm((z.x0+s.c)*T-cam.x,sy*T-cam.y,time)})}
    if(z.kind==="bear"){const [bx,by,dx]=bearPos(now);ppl.push({y:(z.top+by)*T,f:()=>drawBear((z.x0+bx)*T-cam.x,(z.top+by)*T-cam.y,dx)})}}
  const blink=now<flashUntil&&((now/80|0)%2);
  ppl.push({y:player.py+(ferry?1:0),f:()=>{if(!blink)drawPerson(player.px-cam.x+(ferry?8:0),player.py-cam.y-(ferry?3:0),"player",player.dir,player.moving?player.frame:0)}});
  ppl.sort((a,b)=>a.y-b.y).forEach(p=>p.f());
}

/* =================== input & movement =================== */
let state="title",keyHandler=null,bumpLock=false;
const held=[];
const DIRKEY={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",W:"up",s:"down",S:"down",a:"left",A:"left",d:"right",D:"right"};
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
document.addEventListener("keydown",e=>{
  const inInput=e.target&&e.target.tagName==="INPUT";
  if(inInput&&e.key!=="Enter")return;
  if((e.key==="m"||e.key==="M")&&!inInput){toggleSound();return}
  if(state==="walk"){
    const d=DIRKEY[e.key];if(d){e.preventDefault();if(!held.includes(d))held.push(d);return}
    if(e.key===" "||e.key==="Enter"){e.preventDefault();talkFacing();return}
    if(e.key==="r"||e.key==="R"){e.preventDefault();resetHere();return}
  }
  if(keyHandler)keyHandler(e);
});
document.addEventListener("keyup",e=>{const d=DIRKEY[e.key];if(d){const i=held.indexOf(d);if(i>=0)held.splice(i,1);if(!held.length)bumpLock=false}});
document.querySelectorAll(".pad [data-dir]").forEach(b=>{
  const d=b.dataset.dir;const up=()=>{const i=held.indexOf(d);if(i>=0)held.splice(i,1);if(!held.length)bumpLock=false};
  b.addEventListener("pointerdown",e=>{e.preventDefault();if(state==="walk"&&!held.includes(d))held.push(d)});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,up));
});
document.getElementById("abtn").addEventListener("click",()=>{if(state==="walk")talkFacing();else if(keyHandler)keyHandler({key:" ",preventDefault(){},target:document.body})});
document.getElementById("rbtn").addEventListener("click",e=>{e.currentTarget.blur();if(state==="walk")resetHere()});
function curZone(){for(let i=1;i<ROUTE.length;i++){const z=zone(i);if(inZone(z,player.x,player.y))return z}return null}
function resetHere(){const z=curZone();if(z&&(z.kind==="rocks"||z.kind==="bridge")&&S&&!S.zone[z.i].cleared)resetPuzzle(z.i);else showBanner("NOTHING TO RESET","R starts a push puzzle over.")}
function talkFacing(){const [dx,dy]=DV[player.dir];const n=npcAt(player.x+dx,player.y+dy);if(n)interact(n);else if(tAt(player.x+dx,player.y+dy)===TL.GATEC)gateBump(player.x+dx)}
function hit(z){
  const now=performance.now();if(now<invuln||!S)return;
  invuln=now+1400;flashUntil=now+900;sfx.bad();
  const zs=S.zone[z.i];zs.hits++;
  if(S.mode==="party"){S.health=Math.max(10,S.health-3);renderStatus()}
  const [t,sub]=ZHIT[z.kind];showBanner(t,sub+(S.mode==="party"?" (−3 health)":""));
  held.length=0;bumpLock=false;placePlayer(z.A+3,z.y0,"right");
}
function hazards(now){
  if(now<invuln)return;
  const z=curZone()||(player.moving?(()=>{for(let i=1;i<ROUTE.length;i++){const zz=zone(i);if(inZone(zz,player.tx,player.ty))return zz}return null})():null);if(!z)return;
  const bx=player.px+4,by=player.py+4,bw=8,bh=9;const ov=(x,y,w,h)=>bx<x+w&&bx+bw>x&&by<y+h&&by+bh>y;
  if(z.kind==="logs"){for(const ch of LOGCH)for(const ly of logTops(z,ch,now))if(ov((z.x0+ch.c)*T+3,ly*T+1,10,2*T-2))return hit(z)}
  else if(z.kind==="swamp"){for(const s of SWARMS)if(ov((z.x0+s.c)*T+2,swarmY(z,s,now)*T+2,12,12))return hit(z)}
  else if(z.kind==="bear"){const [x,y]=bearPos(now);if(ov((z.x0+x)*T+1,(z.top+y)*T+3,14,12))return hit(z)}
  else if(z.kind==="blast"){const col=Math.floor((player.px+8)/T)-z.x0,row=Math.floor((player.py+8)/T);if(row>=z.top&&row<=z.bot)BLAST.groups.forEach((gr,gi)=>{if(gr.includes(col)&&blastPhase(gi,now)==="boom")hit(z)})}
  else if(z.kind==="stones"&&!player.moving){const s=stones[player.x+","+player.y];if(s&&stoneSunk(s,now))return hit(z)}
}
function update(dt){
  const now=performance.now();
  for(const k in stones){const s=stones[k];if(s.t&&now-s.t>=2700)s.t=0}
  if(ferry){const f=ferry,t=Math.min(1,(now-f.t0)/f.dur);f.n.fx=f.from+(f.to-f.from)*t;player.px=f.n.fx*T;player.py=f.y*T;if(t>=1){f.n.x=f.to;f.n.fx=undefined;ferry=null;f.done()}return}
  if(state!=="walk"){held.length=0;return}
  hazards(now);
  if(S){const z=curZone();if(z&&z.kind!=="ferry"&&!S.zone[z.i].cleared){const zs=S.zone[z.i];zs.t+=dt;if(zs.t>60000||zs.hits>=4){zs.t=0;zs.hits=0;run(()=>offerHelp(z.i));return}}}
  if(!player.moving){
    const d=held[held.length-1];if(!d)return;
    player.dir=d;const [dx,dy]=DV[d],nx=player.x+dx,ny=player.y+dy;
    const n=npcAt(nx,ny);
    if(n){if(!bumpLock){bumpLock=true;interact(n)}return}
    if(tAt(nx,ny)===TL.GATEC){if(!bumpLock){bumpLock=true;gateBump(nx)}return}
    const o=pushAt(nx,ny);
    if(walkable(nx,ny)||(o&&tryPush(o,dx,dy))){player.moving=true;player.fx=player.x;player.fy=player.y;player.tx=nx;player.ty=ny;player.t=0;player.frame++}
    else if(!bumpLock){bumpLock=true;sfx.bump()}
  }else{
    player.t+=dt/130;
    if(player.t>=1){player.x=player.tx;player.y=player.ty;player.px=player.x*T;player.py=player.y*T;player.moving=false;onStep()}
    else{player.px=(player.fx+(player.tx-player.fx)*player.t)*T;player.py=(player.fy+(player.ty-player.fy)*player.t)*T;if(player.t>.5&&player.frame%2===1)player.frame++}
  }
}
function kmAt(x){for(let i=1;i<ROUTE.length;i++){const a=ROUTE[i-1],b=ROUTE[i];if(x<=b.x)return a.km+(b.km-a.km)*Math.max(0,(x-a.x))/(b.x-a.x)}return ROUTE[ROUTE.length-1].km}
function onStep(){
  if(!S)return;renderStatus();
  const now=performance.now();
  const st=stones[player.x+","+player.y];if(st&&!st.safe&&!st.t)st.t=now;
  for(let i=1;i<ROUTE.length;i++){const z=zone(i),zs=S.zone[i];
    if(!zs.seen&&inZone(z,player.x,player.y)){zs.seen=true;showBanner(ZNAME[z.kind],ZTIP[z.kind])}
    if(!zs.cleared&&player.x>=z.x1+1&&player.x<=z.x1+12){zs.cleared=true}}
  const o=objs.find(o=>(o.kind==="tool"||o.kind==="card")&&o.x===player.x&&o.y===player.y);
  if(o){objs.splice(objs.indexOf(o),1);run(()=>pickup(o));return}
  for(let i=1;i<ROUTE.length;i++){
    if(!S.events[i]&&player.x>=eventX(i)&&player.x<ROUTE[i].x-8){S.events[i]=true;if(Math.random()<.6){run(flavourEvent);return}}
    if(!S.arrived[i]&&player.x>=ROUTE[i].x-7){S.arrived[i]=true;run(()=>arrive(i));return}
  }
}
let last=performance.now();
function loop(now){const dt=Math.min(50,now-last);last=now;update(dt);draw(now);requestAnimationFrame(loop)}

async function offerHelp(i){
  const z=zone(i),who=crew();
  const yes=await menu(`<h2>${ZNAME[z.kind]}</h2><p>${esc(who)}: "Having trouble? The crew can get you past this one."</p>`,
    [{key:"1",label:`Yes, help me past${S.mode==="party"?` <span class="dim">· costs 1 day</span>`:""}`,value:true},{key:"2",label:"No, I'll keep trying",value:false}]);
  hidePanel();if(!yes)return;
  if(S.mode==="party")spendDays(1,ZNAME[z.kind].toLowerCase());
  clearZone(i);S.zone[i].cleared=true;placePlayer(z.x1+1,z.y0,"right");
  await say(who,["There you go. Onward!"]);
}
async function ferryRide(n){
  const z=zone(n.i),east=player.x>n.x;
  await say("Ferryman",[east?"Back across? Hop in!":"Big Rideau Lake is too wide to walk around. Hop in and I'll row you across."]);
  const to=east?z.x0:z.x1;player.dir=east?"left":"right";n.dir=player.dir;
  await new Promise(res=>{ferry={n,from:n.x,to,y:n.y,t0:performance.now(),dur:Math.abs(to-n.x)*260,done:res}});
  placePlayer(east?z.x0-1:z.x1+1,z.y0,east?"left":"right");
  if(!east)S.zone[n.i].cleared=true;
}

function say(who,pages){
  if(typeof pages==="string")pages=[pages];

async function ask(q,ctx){
  S.stats[q.skill].a++;S.asked++;window.__q=q;
  let attempts=0,shown=false;
  const A=q.ans;let ansHTML="";
  if(A.type==="num")ansHTML=`<form class="answer" id="ans" autocomplete="off">${A.fields.map((f,i)=>`${f.pre?`<span class="lbl">${f.pre}</span>`:""}<input id="i${i}" aria-label="${esc(f.label)}" autocomplete="off" spellcheck="false">${f.post?`<span class="lbl">${f.post}</span>`:""}`).join("")}<button class="btn" type="submit"><span class="k">ENTER</span> check</button></form>`;
  else if(A.type==="expr"||A.type==="rad"){const keys=A.type==="expr"?[["x²","x²"],["(","("],[")",")"]]:[["√","√"]];
    ansHTML=`<form class="answer" id="ans" autocomplete="off">${A.pre?`<span class="lbl">${A.pre}</span>`:""}<input id="i0" class="wide" aria-label="${esc(A.label)}" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text">${A.post?`<span class="lbl">${A.post}</span>`:""}<span class="keys">${keys.map(([l,v])=>`<button type="button" class="key" data-ins="${v}" aria-label="Type ${l==="√"?"square root":l==="x²"?"x squared":l}">${l}</button>`).join("")}</span><button class="btn" type="submit"><span class="k">ENTER</span> check</button></form><p class="preview" id="pv" aria-live="polite">${A.type==="expr"?"Type it like 3x(2x + 5) or (x + 4)(x − 2). Use ^ or the x² button for squares.":"Type an exact root like 3√5 (√ button or sqrt), or a decimal."}</p>`;}
  else if(A.type==="choice")ansHTML=`<div class="choices" id="ans" role="group" aria-label="Answer choices">${A.opts.map((o,i)=>`<button type="button" class="opt" data-i="${i}"><span class="k">${i+1}.</span> ${o}</button>`).join("")}</div>`;
  else ansHTML=`<form class="answer" id="ans" autocomplete="off"><span class="lbl">Stake D:</span><span id="selTxt" class="gold">tap the field</span><button class="btn" type="submit"><span class="k">ENTER</span> hammer it in</button></form>`;
  showPanel(`<h2>${ctx.header}</h2>${ctx.who?`<p class="dim small">${esc(ctx.who)}</p>`:""}<div class="qwrap${q.fig?"":" nofig"}"><div class="qtext">${q.text}${ansHTML}<div id="fb"></div></div>${q.fig?`<div class="figwrap"><canvas id="fig" class="${q.fig.click?"click":""}" ${q.fig.click?'tabindex="0" aria-label="Survey field. Use the arrow keys to move, then press Enter."':'aria-hidden="true"'}></canvas>${q.fig.click?'<p class="dim small">Tap a grid point, or use the arrow keys and ENTER.</p>':""}</div>`:""}</div><div id="st"></div>`);
  const fb=(cls,html)=>{document.getElementById("fb").innerHTML=`<div class="msg ${cls}">${html}</div>`};
  const figEl=document.getElementById("fig");
  const fst={sel:null,cur:null,wrong:[]};
  const redraw=()=>{if(figEl)drawFig(figEl,q.fig,fst)};
  redraw();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
  return new Promise((res,rej)=>{
    let finished=false;
    const finish=first=>{
      finished=true;
      panel.querySelectorAll("#ans input,#ans button").forEach(el=>el.disabled=true);
      document.getElementById("st").insertAdjacentHTML("beforeend",`<p><button class="btn" id="go">Press SPACE to continue</button></p>`);
      const go=document.getElementById("go");go.focus({preventScroll:true});
      const done=()=>{keyHandler=null;res(first)};go.addEventListener("click",done);
      keyHandler=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();done()}};
    };
    const submit=input=>{
      if(finished)return;
      const r=check(q,input);
      if(r.s==="empty"){fb("hint",r.msg);return}
      if(r.s==="ok"){
        sfx.ok();const first=attempts===0&&!shown;
        if(first){S.first++;S.stats[q.skill].f++;S.health=Math.min(100,S.health+3)}
        renderStatus();
        if(A.type==="choice"){const b=panel.querySelector(`.opt[data-i="${input}"]`);b&&b.classList.add("right")}
        if(A.type==="pt"){fst.selColor=FIGC.green;redraw()}
        fb("good",`CORRECT!${first?"":" Good recovery."}${r.note?` <span class="ink">${r.note}</span>`:""}`);
        finish(first);return;
      }
      attempts++;S.misses++;S.lastMiss=q.skill;sfx.bad();
      if(A.type==="choice"){const b=panel.querySelector(`.opt[data-i="${input}"]`);if(b)b.disabled=true}
      if(A.type==="pt"){fst.wrong.push(input.slice());fst.sel=null;redraw();document.getElementById("selTxt").textContent="tap the field"}
      const line=pick(MISS_LINES);
      let html=`NOT QUITE. <span class="ink">${r.msg}</span><br>${line[0].replace("NAME",esc(crew()))}`;
      try{spendDays(line[1],ctx.where);hurt(line[2],ctx.where)}catch(err){keyHandler=null;rej(err);return}
      if(attempts===2)html+=`<br><span class="gold">HINT: ${q.hint}</span>`;
      fb("bad",html);
      if(attempts>=3){
        shown=true;
        if(A.type==="choice"){const b=panel.querySelector(`.opt[data-i="${A.correct}"]`);b&&b.classList.add("right")}
        if(A.type==="pt"){fst.sel=A.pt;fst.selColor=FIGC.green;redraw()}
        document.getElementById("st").innerHTML=`<div class="steps"><span class="sky">WORKED STEPS</span><ol>${q.steps.map(s=>`<li><span class="why">${s[0]}</span><br><span class="work">${s[1]}</span></li>`).join("")}</ol></div>`;
        finish(false);
      }else if(A.type==="num"||A.type==="expr"||A.type==="rad"){const i0=document.getElementById("i0");i0.focus();i0.select()}
    };
    if(A.type==="num"){
      const f=document.getElementById("ans"),ins=[...f.querySelectorAll("input")];ins[0].focus({preventScroll:true});
      f.addEventListener("submit",e=>{e.preventDefault();submit(ins.map(i=>i.value))});
      keyHandler=null;
    }else if(A.type==="expr"||A.type==="rad"){
      const f=document.getElementById("ans"),inp=document.getElementById("i0"),pv=document.getElementById("pv");inp.focus({preventScroll:true});
      const preview=()=>{const v=inp.value.trim();if(!v){return}
        if(A.type==="expr"){const r=parseExpr(v);pv.innerHTML=r.ast?`You typed: <span class="gold">${esc(pshow(r.ast))}</span>`:`<span class="dim">You typed: ${esc(v)}</span>`}
        else{const r=parseRad(v);pv.innerHTML=r&&!r.bad?`You typed: <span class="gold">${esc(r.form||v)}</span>`:`<span class="dim">You typed: ${esc(v)}</span>`}};
      inp.addEventListener("input",preview);
      f.querySelectorAll(".key").forEach(kb=>kb.addEventListener("click",()=>{const v=kb.dataset.ins,a0=inp.selectionStart??inp.value.length,b0=inp.selectionEnd??a0;
        inp.value=inp.value.slice(0,a0)+v+inp.value.slice(b0);inp.focus();inp.setSelectionRange(a0+v.length,a0+v.length);preview()}));
      f.addEventListener("submit",e=>{e.preventDefault();submit(inp.value)});
      keyHandler=null;
    }else if(A.type==="choice"){
      panel.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>submit(+b.dataset.i)));
      keyHandler=e=>{const n=parseInt(e.key,10);if(n>=1&&n<=A.opts.length){const b=panel.querySelector(`.opt[data-i="${n-1}"]`);if(b&&!b.disabled){e.preventDefault();submit(n-1)}}};
    }else{
      const f=document.getElementById("ans");
      const setSel=p=>{fst.sel=p;fst.selColor=null;redraw();document.getElementById("selTxt").textContent=`(${sn(p[0])}, ${sn(p[1])})`};
      figEl.addEventListener("click",e=>{if(finished)return;const r=figEl.getBoundingClientRect(),[W,H]=figSize(q.fig),gm=gridMap(q.fig,W,H);
        const lx=(e.clientX-r.left)/r.width*W,ly=(e.clientY-r.top)/r.height*H;
        const x=Math.round((lx-gm.pad)/gm.s+gm.lo),y=Math.round((H-gm.pad-ly)/gm.s+gm.lo);
        if(x<gm.lo||x>gm.hi||y<gm.lo||y>gm.hi)return;sfx.key();setSel([x,y]);fst.cur=null});
      figEl.addEventListener("keydown",e=>{if(finished)return;const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];
        if(k){e.preventDefault();e.stopPropagation();const mid=Math.round((q.fig.min+q.fig.max)/2),c0=fst.sel||[mid,mid];
          setSel([Math.max(q.fig.min,Math.min(q.fig.max,c0[0]+k[0])),Math.max(q.fig.min,Math.min(q.fig.max,c0[1]+k[1]))])}
        else if(e.key==="Enter"){e.preventDefault();e.stopPropagation();submit(fst.sel)}});
      f.addEventListener("submit",e=>{e.preventDefault();submit(fst.sel)});
      keyHandler=null;
    }
  });
}

  ()=>({t:"Heavy rain floods the low ground. You wait it out. Lose 1 day.",fn(){spendDays(1,"the rain")}}),

  ()=>({t:`${esc(crew())} starts a song around the fire. The crew feels better.`,fn(){S.health=Math.min(100,S.health+8)}}),
  ()=>({t:"The survey chain snaps on a sharp rock.",fn(){if(S.kits>0){S.kits--;this.t+=" You swap in a spare chain."}else{this.t+=" With no spare, you lose 2 days repairing it.";spendDays(2,"a broken chain")}}}),
  ()=>({t:"Swamp fever (malaria) spreads through the camp. You rest for a day.",fn(){spendDays(1,"swamp fever");hurt(8,"swamp fever")}}),
  ()=>({t:"Algonquin guides show you a trail around a beaver pond. You save a day.",fn(){S.day=Math.max(0,S.day-1);S.food+=EAT}}),

async function flavourEvent(){const ev=pick(FLAVOUR)();ev.fn();renderStatus();await say("Field journal",[`${dateStr(S.day)}. ${ev.t}`])}
async function arrive(i){
  const L=ROUTE[i],prev=ROUTE[i-1];
  spendDays(Math.max(1,Math.round((L.km-prev.km)/KMDAY)),L.name);
  sfx.arrive();showBanner(L.name,`${dateStr(S.day)} · ${L.km} km from Bytown`);
  await say("Field journal",[L.blurb,`Talk to the ${L.npc.name.toLowerCase()} by the gate.`]);
}
async function interact(n){
  if(n.kind==="station")return run(()=>stationTask(n.i));
  if(n.kind==="traveller")return run(()=>traveller(n));
  if(n.kind==="ferry")return run(()=>ferryRide(n));
}
function gateBump(x){const i=ROUTE.findIndex(s=>s.x+2===x);if(i>0)run(()=>stationTask(i))}
const lvl=()=>ROLES[S.role].level;
async function stationTask(i){
  const L=ROUTE[i],n=npcs.find(p=>p.kind==="station"&&p.i===i);
  n.dir=player.x<n.x?"left":player.x>n.x?"right":player.y<n.y?"up":"down";
  if(i===0){await say(L.npc.name,["Kingston is east along the road. The gate at each lock station opens once you finish its task."]);return}
  if(S.done[i]){await say(L.npc.name,[i===ROUTE.length-1?L.done:"The way is open. Safe travels!"]);return}
  await say(L.npc.name,[L.intro]);
  const skills=L.skill==="mixed"?[pick(["line","perp"]),pick(["gcf","tri"]),pick(["dist","shape"]),"sim"]:[L.skill,L.skill,L.skill];
  for(let k=0;k<skills.length;k++){
    await ask(GEN[skills[k]](lvl()),{header:`${L.name.toUpperCase()} · ${L.act} · ${k+1} OF ${skills.length}`,who:L.skill==="mixed"?SKILLNAME[skills[k]]:SKILLNAME[L.skill],where:L.name});
  }
  hidePanel();S.done[i]=true;renderStatus();
  if(i===ROUTE.length-1){await say(L.npc.name,[L.done]);await win();return}
  setT(L.x+2,L.y,TL.GATEO);sfx.gate();
  if(L.reward){S.food+=L.reward;renderStatus()}
  await say(L.npc.name,[L.done+(L.reward?` (+${L.reward} lbs of provisions)`:"")]);
}
async function traveller(n){
  const i=n.i;n.dir=player.x<n.x?"left":"right";
  if(S.crossed[i]){await say(n.name,["Safe travels, surveyor!"]);return}
  const pool=[];for(let k=1;k<i;k++)if(ROUTE[k].skill&&ROUTE[k].skill!=="mixed")pool.push(k);
  const k=pick(pool),sk=ROUTE[k].skill;
  await say(n.name,[`Hold on, surveyor! Before you cross my bridge, check my figures? It's the same kind of work they had you do at ${ROUTE[k].name}.`]);
  const first=await ask(GEN[sk](lvl()),{header:`${n.name.toUpperCase()} · BRIDGE · REVIEW`,who:SKILLNAME[sk],where:"a creek bridge"});
  hidePanel();S.crossed[i]=true;
  n.x=n.x+1;n.y=n.y-1;n.dir="down";
  if(first){S.food+=15;renderStatus()}
  await say(n.name,[first?"Much obliged! Take some provisions for the road. (+15 lbs)":"That sorted it out. Thank you. On you go!"]);
}
async function run(fn){
  if(state!=="walk")return;
  state="busy";held.length=0;
  try{await fn();if(state==="busy")state="walk"}
  catch(e){
    hidePanel();dialog.hidden=true;
    if(e instanceof GameOver){await lose(e.cause);titleLoop()}
    else{console.error(e);state="walk"}
  }
}

function score(){
  const r=ROLES[S.role];
  const parts=[["Questions right on the first try",S.first*100],["Lost tools found",S.tools.length*50],["History cards found",S.cards.length*25],["Crew health",S.health*2],["Provisions left (lbs)",Math.max(0,Math.round(S.food))],["Spare chains left",S.kits*20],["Money left",Math.round(S.money)]];
  const sub=parts.reduce((s,p)=>s+p[1],0);
  return{parts,mult:r.mult,total:sub*r.mult};
}
function reportHTML(){
  const keys=Object.keys(S.stats).filter(k=>S.stats[k].a>0);
  const rows=keys.map(k=>{const s=S.stats[k];const ok=s.f*3>=s.a*2;return `<tr><td>${SKILLNAME[k]}</td><td>${s.f} of ${s.a}</td><td class="${ok?"green":"red"}">${ok?"Ready":"Review this"}</td></tr>`}).join("");
  const weak=keys.filter(k=>S.stats[k].f*3<S.stats[k].a*2).map(k=>SKILLNAME[k]);
  return `<h2>SURVEY REPORT</h2><table class="report"><tr><th>Skill</th><th>First try</th><th></th></tr>${rows}</table>
    <p>${weak.length?`Before the test, review: <span class="gold">${weak.join(", ")}</span>. Use the unit summary and the worksheet for that lesson.`:"You got most questions on the first try in every skill. You're ready for the test."}</p>`;
}

    };drawStore();
  });
  S.food=food;S.kits=kits;S.money-=food*FOOD_PRICE+kits*KIT_PRICE;
  hidePanel();renderStatus();state="busy";
  showBanner("Bytown",dateStr(0));
  await say("Colonel By",[`Welcome to Bytown, ${S.names[0]}. I need the whole route to Kingston surveyed: 202 km of river, swamp and rock.`,`Walk east along the road. At each lock station, someone with a ! has a survey task, and their gate opens when it's done.`,`Travellers on the creek bridges may ask for help too. ${S.names.slice(1).join(", ")}, keep your leader fed. Off you go!`]);
  state="walk";if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();
}

/* =================== debug hooks for testing =================== */
window.__game={state:()=>state,player,S:()=>S,teleport(x,y){placePlayer(x,y,"right")},npcs:()=>npcs,tAt,walkable,held:()=>held.slice(),bump:()=>bumpLock,
  objs:()=>objs,zone,ZKIND,ROUTE,YS,YM,WW,WH,segA,creekX,stones:()=>stones,skipZone(i){clearZone(i);if(S)S.zone[i].cleared=true;const z=zone(i);placePlayer(z.x1+1,z.y0,"right")},invuln:()=>invuln,setInvuln(t){invuln=t},setHeld(d){held.length=0;bumpLock=false;if(d)held.push(d)}};

buildWorld();requestAnimationFrame(loop);titleLoop();
})();
</script>
