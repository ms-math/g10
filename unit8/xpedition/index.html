<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-Pedition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/*
VOICE: a cheerful retro handheld — playful, readable, never scary.
IDEA: a pocket game console; the page is its housing, the game is the screen.
PICTURE: the live game canvas, as large as the window allows.
COLOUR and TYPE: plum housing #2a1f3a, toque orange #ff8a3d accent, cream #f6eedd text; Press Start 2P for game type, Atkinson Hyperlegible for questions.
LAYOUT: small title bar, the screen, a one-line controls legend.
*/
:root{color-scheme:dark;--bg:#1a1424;--shell:#2a1f3a;--ink:#f6eedd;--dim:#b9a9cf;--acc:#ff8a3d;--ok:#63d471;--bad:#ff6b6b;--panel:#1c1429;--px:'Press Start 2P',ui-monospace,monospace;--rd:'Atkinson Hyperlegible',system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg) radial-gradient(circle at 50% -20%,#3b2b52 0,transparent 60%);color:var(--ink);font:16px/1.5 var(--rd);display:flex;justify-content:center;overflow-x:clip}
#app{width:min(100%,1180px);padding:12px max(2vw,8px) 16px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font:16px/1 var(--px);margin:0;letter-spacing:1px}
header h1 b{color:var(--acc);font-weight:400}
header p{margin:0;color:var(--dim);font-size:14px;flex:1}
.hbtn{font:10px var(--px);background:var(--shell);color:var(--ink);border:2px solid #4a3a63;border-radius:8px;padding:9px 10px;cursor:pointer;min-height:36px}
.hbtn:hover,.hbtn:focus-visible{border-color:var(--acc);outline:none}
#housing{background:var(--shell);border-radius:20px;padding:clamp(8px,1.4vw,16px);box-shadow:inset 0 2px 0 #3d2e54,inset 0 -3px 0 #1c1428,0 18px 40px #0008}
#stage{position:relative;width:100%;aspect-ratio:400/224;background:#000;border-radius:8px;overflow:hidden;container-type:inline-size;border:3px solid #120c1a}
#stage:fullscreen{border:0;border-radius:0;display:grid;place-items:center;aspect-ratio:auto}
#stage:fullscreen canvas{width:min(100vw,calc(100vh*400/224));height:auto;position:static}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
footer{color:var(--dim);font-size:13px;text-align:center}
footer kbd{font:9px var(--px);background:var(--shell);border:1px solid #4a3a63;border-radius:4px;padding:3px 5px;color:var(--ink)}
/* overlays */
#ui{position:absolute;inset:0;pointer-events:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;padding:2cqw}
.ov.dim{background:#120c1acc}
.ov.low{align-items:flex-end;padding-bottom:7cqw}
.panel{background:var(--panel);border:4px solid var(--ink);box-shadow:0 0 0 4px #120c1a,0 10px 0 4px #0006;border-radius:6px;padding:clamp(10px,2.2cqw,22px);max-height:96%;overflow:auto;width:min(92%,640px);font-size:clamp(14px,1.9cqw,19px)}
.panel h2{font:clamp(11px,1.8cqw,16px)/1.4 var(--px);margin:0 0 .7em;color:var(--acc)}
.panel p{margin:.3em 0 .8em}
.menu{display:flex;flex-direction:column;gap:clamp(6px,1cqw,10px);width:min(70%,340px);margin:auto}
.g2{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));width:100%!important}
.g2 .pri{grid-column:1/-1}
.tmenu{flex-direction:row;flex-wrap:wrap;justify-content:center;width:min(94%,620px)}
.tmenu .btn{flex:1 1 160px}
.btn{font:clamp(9px,1.45cqw,13px)/1.3 var(--px);background:#3a2b52;color:var(--ink);border:3px solid #6b5590;border-radius:6px;padding:clamp(8px,1.3cqw,13px) 12px;cursor:pointer;min-height:40px;text-align:center}
.btn:hover,.btn:focus-visible{border-color:var(--acc);background:#4a3868;outline:none}
.btn.pri{background:var(--acc);border-color:#ffc08f;color:#2a1405}
.btn.pri:hover,.btn.pri:focus-visible{background:#ffa25f}
.btn.ghost{background:transparent;border-color:#4a3a63;color:var(--dim)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.code{font:clamp(12px,2.3cqw,22px)/1.4 var(--px);letter-spacing:2px;background:#0f0a16;border:3px dashed var(--acc);border-radius:6px;padding:.6em;text-align:center;color:#ffd9b8;user-select:all;word-break:break-all}
input.txt{font:clamp(16px,2.2cqw,22px) var(--rd);background:#0f0a16;color:var(--ink);border:3px solid #6b5590;border-radius:6px;padding:.4em .6em;width:100%;min-height:44px}
input.txt:focus{border-color:var(--acc);outline:none}
.err{color:var(--bad);min-height:1.4em;margin:.4em 0 0}
.small{font-size:.85em;color:var(--dim)}
/* question */
.q{width:min(94%,700px)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:.6em;font:clamp(8px,1.25cqw,11px)/1.4 var(--px);color:var(--dim)}
.tier{padding:4px 7px;border-radius:4px;color:#140d1d}
.t1{background:#8fe3a0}.t2{background:#ffd166}.t3{background:#d59bff}
.prompt{font-size:clamp(17px,2.7cqw,27px);line-height:1.45;margin:.2em 0 .6em}
.prompt i,.sol i,.hint i,.mcb i{font-family:Georgia,'Times New Roman',serif;font-size:1.08em}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.05;margin:0 .1em}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 .15em}
.qrow{display:flex;gap:8px}
.qrow .btn{flex:none}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.key{font:clamp(14px,1.8cqw,18px) var(--rd);background:#2c2140;color:var(--ink);border:2px solid #4a3a63;border-radius:6px;min-width:44px;min-height:40px;cursor:pointer}
.key:hover,.key:focus-visible{border-color:var(--acc);outline:none}
.mc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mcb{font:clamp(15px,2.2cqw,21px) var(--rd);text-align:left;background:#2c2140;color:var(--ink);border:3px solid #4a3a63;border-radius:6px;padding:.5em .7em;cursor:pointer;min-height:44px}
.mcb b{font:clamp(9px,1.2cqw,11px) var(--px);color:var(--acc);margin-right:.5em}
.mcb:hover,.mcb:focus-visible{border-color:var(--acc);outline:none}
.mcb:disabled{opacity:.35;cursor:default}
.fb{min-height:1.5em;margin:.5em 0 .2em;font-weight:700}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.hint{background:#2b2240;border-left:5px solid #ffd166;padding:.5em .8em;border-radius:4px;margin:.4em 0}
.sol{background:#14301f;border-left:5px solid var(--ok);padding:.5em .8em;border-radius:4px;margin:.4em 0}
.sol table{border-collapse:collapse;margin:.3em 0}
.sol td{padding:.1em .9em .1em 0;vertical-align:top}
.sol{font-size:.95em}
.am{border-collapse:collapse;margin:.2em 0}
.rad{border-top:1.5px solid currentColor;padding:0 .05em;margin-left:.02em}
.am th,.am td{border:2px solid #63d471;padding:.15em .6em;text-align:center;min-width:3.2em}
.am th{color:#ffd166;font-weight:700;border-color:#2f6b45}
.am tr:first-child td:first-child{border:0}
.sol td:first-child{white-space:nowrap}
.sol td.n{color:#9af0ac;font-size:.88em}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:.6em;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
table.score{width:100%;border-collapse:collapse;margin:.3em 0 .6em}
table.score td,table.score th{padding:.14em .3em;border-bottom:1px solid #3a2b52;text-align:left}
table.score td:last-child,table.score th:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.score th{font:clamp(8px,1.2cqw,10px) var(--px);color:var(--dim)}
table.score tr.tot td{font-weight:700;border-bottom:0}
.stars{display:grid;gap:3px;margin:.2em 0 .5em}
.stars div{display:flex;gap:.6em;align-items:center}
.stars .s{font:clamp(14px,2cqw,20px) var(--px);color:#4a3a63}
.stars .s.on{color:#ffd23f}
/* on-screen menu button */
.mbtn{position:absolute;top:.6%;left:50%;transform:translateX(-50%);z-index:2;font:clamp(8px,1.5cqw,13px) var(--px);background:#1c1429cc;color:var(--ink);border:2px solid #6b5590;border-radius:6px;padding:.45em .8em;cursor:pointer;min-height:28px}
.mbtn.onmap{top:auto;bottom:1.2%;left:1.2%;transform:none}
.mbtn:hover,.mbtn:focus-visible{border-color:var(--acc);outline:none}
/* touch */
#touch{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:2cqw;pointer-events:none}
#touch .grp{display:flex;gap:2cqw}
#touch button{pointer-events:auto;width:clamp(48px,9cqw,84px);height:clamp(48px,9cqw,84px);border-radius:50%;border:3px solid #fff8;background:#0006;color:#fff;font:clamp(9px,1.6cqw,14px) var(--px);touch-action:none;user-select:none;-webkit-user-select:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){header p{display:none}footer{font-size:12px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><b>X</b>-PEDITION</h1>
    <p>An MPM2D review adventure</p>
    <button class="hbtn" id="fsBtn" type="button">Full screen</button>
  </header>
  <div id="housing">
    <div id="stage">
      <canvas id="c" width="400" height="224" aria-label="X-Pedition game screen"></canvas>
      <button id="menuBtn" class="mbtn hidden" type="button" aria-label="Pause and menu">&#10073;&#10073; MENU</button>
      <div id="ui"></div>
      <div id="touch" class="hidden">
        <div class="grp"><button data-k="left" aria-label="Left">&#9664;</button><button data-k="down" aria-label="Down">&#9660;</button><button data-k="right" aria-label="Right">&#9654;</button></div>
        <div class="grp"><button data-k="run" aria-label="Run">RUN</button><button data-k="jump" aria-label="Jump">JUMP</button></div>
      </div>
    </div>
  </div>
  <footer><kbd>&larr;</kbd> <kbd>&rarr;</kbd> move &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>Shift</kbd> run &nbsp; <kbd>&uarr;</kbd> <kbd>&darr;</kbd> ladders &nbsp; <kbd>Esc</kbd> pause &nbsp; <kbd>M</kbd> music</footer>
</div>
<script>
{ // ===== X-PEDITION — single-file game. Sections: CORE, ART, MATH (question bank), LEVELS, GAME =====
'use strict';
// =====================================================================
// CORE: constants, utilities, input, sound
// =====================================================================
const T = 16, VW = 400, VH = 224, STEP = 1000 / 60;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const UI = document.getElementById('ui');
const FONT = '8px "Press Start 2P", monospace';

const rnd = Math.random;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const nz = (a, b) => { let v; do { v = ri(a, b); } while (v === 0); return v; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };
const lcm = (a, b) => a / gcd(a, b) * b;
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- input
const keys = {}, pressed = {};
const KEYMAP = {
  ArrowLeft: ['left'], KeyA: ['left'], ArrowRight: ['right'], KeyD: ['right'],
  ArrowUp: ['jump', 'up'], KeyW: ['jump', 'up'], Space: ['jump'], KeyZ: ['jump'],
  ArrowDown: ['down'], KeyS: ['down'], ShiftLeft: ['run'], ShiftRight: ['run'], KeyX: ['run'],
  Escape: ['pause'], KeyP: ['pause'], Enter: ['ok'], KeyM: ['music']
};
function overlayButtons() { const ov = UI.lastElementChild; return ov ? [...ov.querySelectorAll('button:not(:disabled), input')].filter(b => b.offsetParent) : []; }
addEventListener('keydown', e => {
  const ae = document.activeElement, tag = ae && ae.tagName;
  if (tag === 'INPUT') return;
  if (UI.children.length) { // a menu/dialog is open
    if (e.code === 'ArrowDown' || e.code === 'ArrowUp' || ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && UI.lastElementChild?.dataset.lr)) {
      const b = overlayButtons(); if (!b.length) return;
      e.preventDefault();
      let i = b.indexOf(ae); const fwd = e.code === 'ArrowDown' || e.code === 'ArrowRight';
      i = i < 0 ? 0 : (i + (fwd ? 1 : -1) + b.length) % b.length; b[i].focus(); return;
    }
    if (tag === 'BUTTON' && (e.code === 'Enter' || e.code === 'Space')) return;
  }
  const ks = KEYMAP[e.code]; if (!ks) return;
  e.preventDefault();
  for (const k of ks) { if (!keys[k]) pressed[k] = true; keys[k] = true; }
});
addEventListener('keyup', e => { const ks = KEYMAP[e.code]; if (ks) for (const k of ks) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
// touch buttons
for (const b of document.querySelectorAll('#touch button')) {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); if (!keys[k]) pressed[k] = true; keys[k] = true; audioInit(); };
  const off = e => { e.preventDefault(); keys[k] = false; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
}

// ---------- settings + storage (localStorage may be missing: always try/catch)
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};
const settings = Object.assign({ sfx: true, music: true, touch: matchMedia('(pointer:coarse)').matches }, store.get('xped-settings', {}));
const saveSettings = () => store.set('xped-settings', settings);

// ---------- sound (WebAudio, synthesized; starts on first click/key)
const Snd = { ctx: null, master: null, musicGain: null };
function audioInit() {
  if (Snd.ctx) { if (Snd.ctx.state === 'suspended') Snd.ctx.resume(); return; }
  try {
    Snd.ctx = new (window.AudioContext || window.webkitAudioContext)();
    Snd.master = Snd.ctx.createGain(); Snd.master.gain.value = 0.22; Snd.master.connect(Snd.ctx.destination);
    Snd.musicGain = Snd.ctx.createGain(); Snd.musicGain.gain.value = 0.32; Snd.musicGain.connect(Snd.master);
  } catch (e) { Snd.ctx = null; }
}
addEventListener('pointerdown', audioInit); addEventListener('keydown', audioInit);
function tone(f, dur, type = 'square', vol = 0.3, slide = null, delay = 0, dest = null) {
  const c = Snd.ctx; if (!c) return;
  if (!dest && !settings.sfx) return;
  const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest || Snd.master); o.start(t); o.stop(t + dur + 0.03);
}
const arp = (fs, d, type, vol, gap) => fs.forEach((f, i) => tone(f, d, type, vol, null, i * gap));
const SFX = {
  jump: () => tone(300, 0.16, 'square', 0.16, 640),
  coin: () => { tone(988, 0.06, 'square', 0.13); tone(1319, 0.2, 'square', 0.13, null, 0.06); },
  stomp: () => tone(220, 0.14, 'square', 0.22, 70),
  hurt: () => tone(320, 0.32, 'sawtooth', 0.18, 90),
  spring: () => tone(170, 0.32, 'triangle', 0.4, 760),
  correct: () => arp([523, 659, 784, 1047], 0.13, 'square', 0.14, 0.07),
  wrong: () => { tone(170, 0.16, 'square', 0.18); tone(125, 0.26, 'square', 0.18, null, 0.12); },
  gate: () => arp([392, 523, 659, 784, 1047], 0.12, 'triangle', 0.32, 0.05),
  crystal: () => arp([784, 988, 1175, 1568, 1976], 0.14, 'square', 0.11, 0.06),
  check: () => arp([440, 554, 659], 0.14, 'triangle', 0.32, 0.08),
  portal: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.18, 'square', 0.13, 0.1),
  select: () => tone(660, 0.05, 'square', 0.1),
  heart: () => arp([659, 880, 1175], 0.12, 'triangle', 0.32, 0.06),
  fall: () => tone(600, 0.6, 'triangle', 0.3, 80),
  boom: () => { tone(90, 0.5, 'sawtooth', 0.25, 40); tone(60, 0.6, 'square', 0.18, 30, 0.05); },
  bossHit: () => { arp([880, 660, 440, 330], 0.1, 'square', 0.18, 0.05); tone(110, 0.4, 'sawtooth', 0.2, 55, 0.1); },
  twang: () => tone(520, 0.12, 'triangle', 0.18, 260),
  crash: () => { tone(140, 0.18, 'sawtooth', 0.16, 50); tone(90, 0.2, 'square', 0.12, 40, 0.04); },
};

// ---------- music: tiny original loops, scheduled ahead
const NOTE = n => { if (n === '-') return 0; const m = n.match(/^([A-G])(#?)(\d)$/); const s = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 }[m[1]] + (m[2] ? 1 : 0); return 440 * Math.pow(2, (s + (m[3] - 4) * 12) / 12); };
const TUNES = {
  meadow: { bpm: 150,
    lead: 'E5 G5 A5 G5 E5 D5 C5 D5 E5 G5 A5 C6 B5 A5 G5 - A5 B5 C6 A5 G5 E5 D5 E5 C5 D5 E5 G5 D5 - C5 -',
    bass: 'C3 G2 C3 G2 A2 E3 A2 E3 F2 C3 F2 C3 G2 D3 G2 B2' },
  cave: { bpm: 132,
    lead: 'A4 C5 E5 A5 G5 E5 C5 E5 F4 A4 C5 F5 E5 C5 A4 C5 D4 F4 A4 D5 C5 A4 F4 A4 E4 G#4 B4 E5 D5 B4 G#4 -',
    bass: 'A2 A2 E2 E2 F2 F2 C3 C3 D2 D2 A2 A2 E2 E2 E2 E2' },
  cliffs: { bpm: 140,
    lead: 'D5 F5 A5 G5 F5 E5 D5 - C5 E5 G5 F5 E5 D5 C5 - D5 F5 A5 C6 A5 G5 F5 E5 D5 E5 F5 E5 D5 - - -',
    bass: 'D3 A2 D3 A2 C3 G2 C3 G2 D3 A2 D3 A2 A2 E3 A2 E3' },
  sky: { bpm: 126,
    lead: 'G5 B5 D6 B5 A5 F#5 D5 F#5 G5 A5 B5 D6 E6 D6 B5 - C6 B5 A5 G5 F#5 A5 D5 - E5 F#5 G5 A5 B5 A5 G5 -',
    bass: 'G2 D3 G2 D3 C3 G3 C3 G3 E2 B2 E2 B2 D3 A2 D3 F#3' },
  oak: { bpm: 128,
    lead: 'G4 B4 D5 G5 F#5 D5 E5 C5 D5 B4 G4 A4 B4 - D5 - E5 G5 C6 B5 A5 G5 F#5 A5 G5 D5 B4 D5 G5 - G5 -',
    bass: 'G2 D3 G2 D3 C3 G2 C3 G2 D3 A2 D3 A2 G2 D3 G2 D3' },
  hollow: { bpm: 100,
    lead: 'A4 C5 E5 - D5 C5 B4 - A4 C5 E5 A5 G5 - E5 - F5 E5 D5 - C5 B4 A4 - G#4 B4 D5 E5 C5 B4 A4 -',
    bass: 'A2 E3 A2 E3 F2 C3 F2 C3 D2 A2 D2 A2 E2 B2 E2 G#2' },
  canopy: { bpm: 144,
    lead: 'C5 E5 G5 E5 F5 A5 G5 E5 D5 F5 A5 G5 E5 C5 D5 - E5 G5 C6 G5 A5 F5 D5 F5 E5 D5 C5 D5 E5 - C5 -',
    bass: 'C3 G2 C3 G2 F2 C3 F2 C3 G2 D3 G2 D3 C3 G2 C3 G2' },
  thicket: { bpm: 112,
    lead: 'E5 G5 B5 G5 A5 - G5 E5 D5 E5 G5 - E5 - - - E5 G5 B5 D6 C6 B5 A5 G5 F#5 G5 A5 F#5 E5 - - -',
    bass: 'E3 B2 E3 B2 C3 G2 C3 G2 D3 A2 D3 A2 B2 F#2 B2 F#2' },
  forest: { bpm: 132,
    lead: 'D5 F#5 A5 F#5 G5 B5 A5 F#5 E5 G5 B5 A5 F#5 D5 E5 - F#5 A5 D6 A5 B5 G5 E5 G5 F#5 E5 D5 E5 F#5 - D5 -',
    bass: 'D3 A2 D3 A2 G2 D3 G2 D3 A2 E3 A2 E3 D3 A2 D3 A2' },
  keep: { bpm: 120,
    lead: 'E5 - B4 E5 G5 F#5 E5 D#5 E5 - B4 E5 A5 G5 F#5 - G5 A5 B5 G5 F#5 E5 D#5 B4 C5 B4 A4 B4 E5 - - -',

    island(x1, x2, top, depth = 3) { for (let x = x1; x <= x2; x++) for (let y = top; y < Math.min(H, top + depth); y++) set(x, y, '#'); },
    wind(x, y1, y2, w = 2) { ents.push({ type: 'wind', x: x * T, y: y1 * T, w: w * T, h: (y2 - y1 + 1) * T }); },
    torch(x, y) { ents.push({ type: 'torch', x: x * T + 5, y: y * T + 2, w: 6, h: 10 }); },
    shooter(x, y, dir = -1, period = 130, offset = 0) { set(x, y, 'B'); ents.push({ type: 'shooter', x: x * T, y: y * T, w: T, h: T, dir, period, t: offset }); },
    tspike(x, y, offset = 0) { ents.push({ type: 'tspike', x: x * T, y: y * T + 8, w: T, h: 8, t: offset }); },
    boss(x, gy, x1, x2, wall, o = {}) { ents.push({ type: 'boss', x: x * T, y: gy * T - 30, w: 28, h: 30, hp: 3, st: 'sleep', t: 0, vx: 0, vy: 0, face: -1, inv: 0, x0: x1 * T, x1: x2 * T - 28, wall, name: o.name || 'X-GOLEM', title: o.title || 'THE X-GOLEM', skill: o.skill || 'u1.7', art: o.art || 'golem' }); },
    ceil(x1, x2, bottom) { for (let x = x1; x <= x2; x++) for (let y = 0; y <= bottom; y++) set(x, y, '#'); },
    drip(x) { let r = 0; while (r < H && grid[r][x] === '#') r++; ents.push({ type: 'drip', x: x * T + 4, y: r * T, oy: r * T, w: 8, h: 11, st: 0, t: 0, vy: 0 }); },
    block(x, y, w = 1, h = 1) { for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) set(x + i, y + j, 'B'); },
    trunk(x, y1, y2, w = 1) { for (let i = 0; i < w; i++) for (let y = y1; y <= y2; y++) set(x + i, y, 'T'); },
    zip(x1, y1, x2, y2) { const ax = x1 * T + 8, ay = y1 * T, bx = x2 * T + 8, by = y2 * T; ents.push({ type: 'zip', x: Math.min(ax, bx), y: Math.min(ay, by), w: Math.abs(bx - ax), h: Math.abs(by - ay) + 1, x1: ax, y1: ay, x2: bx, y2: by, len: Math.hypot(bx - ax, by - ay), m: rat(-(y2 - y1), x2 - x1) }); },
    ladder(x, y1, y2) { for (let y = y1; y <= y2; y++) set(x, y, 'H'); },
    plat(x, y, len) { for (let i = 0; i < len; i++) set(x + i, y, '='); },
    spikes(x1, x2, y) { for (let x = x1; x <= x2; x++) set(x, y, '^'); },
    coin(x, y) { ents.push({ type: 'coin', x: x * T + 3, y: y * T + 3, w: 10, h: 10 }); },
    coins(x, y, n, dx = 1) { for (let i = 0; i < n; i++) this.coin(x + i * dx, y); },
    coinArc(x1, x2, top) { const n = x2 - x1; for (let i = 0; i <= n; i++) { const t = i / n, y = top + Math.round(4 * (t - 0.5) * (t - 0.5) * 4) / 2; ents.push({ type: 'coin', x: (x1 + i) * T + 3, y: Math.round(y * T) + 3, w: 10, h: 10 }); } },
    enemy(kind, x, gy) { if (kind === 'hopper') ents.push({ type: 'hopper', x: x * T + 1, y: gy * T - 11, w: 14, h: 11, vx: -0.45, alive: true, hop: (x * 37) % 100 }); if (kind === 'spiky') ents.push({ type: 'spiky', x: x * T + 1, y: gy * T - 10, w: 14, h: 10, vx: -0.35, alive: true }); if (kind === 'blorb') ents.push({ type: 'blorb', x: x * T + 1, y: gy * T - 12, w: 14, h: 12, vx: -0.45, alive: true }); },
    buzz(x, y, range = 2, skin = 'buzz') { ents.push({ type: 'buzz', skin, x: x * T + 1, y: y * T, x0: x * T + 1, y0: y * T, w: 14, h: 12, range: range * T, vx: -0.5, t: x * 13, alive: true }); },
    gate(x, gy, skill, tier) { for (let y = 0; y < gy; y++) if (grid[y][x] === '.') set(x, y, 'G'); ents.push({ type: 'gate', tx: x, gy, x: x * T, y: (gy - 4) * T, w: T, h: 4 * T, skill, tier, open: false, anim: 0, missed: false, cool: 0 }); },
    checkpoint(x, gy) { ents.push({ type: 'check', x: x * T + 4, y: gy * T - 32, w: 8, h: 32, lit: false, rx: x * T + 3, ry: gy * T - 15 }); },
    crystal(x, y, skill, tier = 3) { ents.push({ type: 'crystal', x: x * T + 2, y: y * T + 2, w: 12, h: 12, skill, tier, got: false, cool: 0 }); },
    portal(x, gy, hidden = false) { ents.push({ type: 'portal', x: x * T - 4, y: gy * T - 40, w: 24, h: 40, hidden }); },
    spring(x, gy) { ents.push({ type: 'spring', x: x * T, y: gy * T - 10, w: 16, h: 10, anim: 0 }); },
    mover(x, y, len, x2, sp = 0.6) { ents.push({ type: 'mover', axis: 'x', x: x * T, y: y * T, w: len * T, h: 7, x0: x * T, x1: x2 * T, sp, dir: 1, dx: 0, dy: 0 }); },
    vmover(x, y, len, y2, sp = 0.5) { ents.push({ type: 'mover', axis: 'y', x: x * T, y: y * T, w: len * T, h: 7, y0: Math.min(y, y2) * T, y1: Math.max(y, y2) * T, sp, dir: -1, dx: 0, dy: 0 }); },
    balance(x1, x2, y, w = 3, range = 4) { const mk = x => ({ type: 'mover', axis: 'lift', x: x * T, y: y * T, base: y * T, w: w * T, h: 7, range: range * T, top: (y - range) * T - 26, v: 0, dx: 0, dy: 0 }); const a = mk(x1), b = mk(x2); a.lead = true; a.mate = b; b.mate = a; ents.push(a, b); },
    swing(x, y, len = 6) { const L = len * T; ents.push({ type: 'swing', ax: x * T + 8, ay: y * T, len: L, th: ((x * 7) % 5 - 2) * 0.12, om: 0, x: x * T + 8 - L, y: y * T, w: 2 * L, h: L + 8 }); },
    mesh(x1, x2, y1, y2) { for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) set(x, y, 'n'); },
    shroom(x, gy, kind) { ents.push({ type: 'shroom', kind, x: x * T + 1, y: gy * T - 11, w: 14, h: 11, cool: 0 }); },
    crumble(x, y, n = 1) { for (let i = 0; i < n; i++) ents.push({ type: 'crumble', x: (x + i) * T, y: y * T, oy: y * T, w: T, h: 7, t: 0, fall: false, vy: 0, back: 0 }); },
    heart(x, y) { ents.push({ type: 'heart', x: x * T + 4, y: y * T + 5, w: 7, h: 6 }); },
    sign(x, gy, text) { ents.push({ type: 'sign', x: x * T + 1, y: gy * T - 14, w: 14, h: 14, text }); },
  };
  def.build(L);
  for (const e of ents) if (sk[e.type] && (!e.skin || e.skin === 'buzz')) e.skin = sk[e.type];
  return L;
}

    onMiss() { e.missed = true; },
    onSolve() { e.open = true; e.anim = 0; for (let y = 0; y < e.gy; y++) if (G.grid[y][e.tx] === 'G') G.grid[y][e.tx] = '.'; SFX.gate(); coinBurst(e.x + 8, (e.gy - 2) * T, 2 + e.tier); addScore(e.missed ? 100 : 300, e.x + 8, (e.gy - 5) * T); saveResume(); },
    onBack() { e.cool = 45; G.p.x = e.x - G.p.w - 14; G.p.vx = 0; } });
}
function askCrystal(e) {
  openQuestion({ skill: e.skill, tier: e.tier, tag: 'CHALLENGE CRYSTAL', optional: true,
    onSolve() { e.got = true; G.crystal = true; SFX.crystal(); if (G.hearts < 3) G.hearts++; sparkle(e.x + 6, e.y + 6, '#e4a8ff', 16); coinBurst(e.x + 6, e.y + 6, 8); addScore(1000, e.x + 6, e.y - 10); saveResume(); },

const Q = {};

function newQuestion() {

  G.recent.add(q.prompt); Q.q = q; Q.misses = 0; Q.locked = false;
  { const tg = $('#qtag'); if (tg) tg.textContent = Q.cfg.tag + ' · LESSON ' + SKILLS[Q.skill].lesson + (q.from ? ' · REVIEW OF ' + q.from : ''); }
  $('#qp').innerHTML = q.prompt; $('#qfb').textContent = ''; $('#qfb').className = 'fb';
  $('#qh').classList.add('hidden'); $('#qs').classList.add('hidden');

  const isMC = q.type === 'mc';

function submitAnswer(v) {

// typing x^2 or x2 turns into x² right in the box (the checker reads both)
const SUPD = '⁰¹²³⁴⁵⁶⁷⁸⁹';

function updateMap() {
  if (UI.children.length) return;

  if (pressed.pause) { openMapMenu(); return; }
  if (W.levels) { if (pressed.left && map.sel > 0) { map.sel--; SFX.select(); } else if (pressed.left && map.w > 1) { map.w--; map.sel = 4; SFX.select(); }
    if (pressed.right && map.sel < W.levels.length - 1) { map.sel++; SFX.select(); } else if (pressed.right && map.w < WORLDS.length) { map.w++; map.sel = 0; SFX.select(); } }
  else { if (pressed.left && map.w > 1) { map.w--; map.sel = 4; SFX.select(); } if (pressed.right && map.w < WORLDS.length) { map.w++; map.sel = 0; SFX.select(); } }
  if (pressed.up && map.w < WORLDS.length) { map.w++; map.sel = 0; SFX.select(); }
  if (pressed.down && map.w > 1) { map.w--; map.sel = 0; SFX.select(); }

cv.addEventListener('click', e => {
  if (mode !== 'map' || UI.children.length) return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * VW, y = (e.clientY - r.top) / r.height * VH;
  if (y < 30) { if (x > VW - 40 && map.w < WORLDS.length) { map.w++; map.sel = 0; } else if (x < 40 && map.w > 1) { map.w--; map.sel = 0; } return; }
  if (!WORLDS[map.w - 1].levels) return;
  NODES.forEach(([nx, ny], i) => { if (Math.abs(x - nx) < 18 && Math.abs(y - ny) < 18) { if (map.sel === i) tryPlay(); else { map.sel = i; SFX.select(); } } });
});

function drawEnt(e, cx) {
  const x = Math.round(e.x - cx), y = Math.round(e.y), t = G.t;
  switch (e.type) {

  if (G.bossOn) { const b = G.bossOn; box(VW / 2 - 60, 22, 120, 12, '#1c1429', '#ff5f7a'); txt(b.name, VW / 2 - 54, 24, '#ffd9b8'); for (let i = 0; i < 3; i++) { ctx.fillStyle = i < b.hp ? '#ff5f7a' : '#4a3a63'; ctx.fillRect(VW / 2 + 6 + i * 17, 25, 14, 6); } }
  if (G.bossBanner > 0 && !UI.children.length) { G.bossBanner--; box(VW / 2 - 100, 70, 200, 34, '#1c1429', '#ff5f7a'); txt(G.bossBannerFor.title + '!', VW / 2, 76, '#ff8f86', 'center'); txt('JUMP ON ITS HEAD', VW / 2, 90, '#f6eedd', 'center'); }
  if (G.sign && !UI.children.length) { const lines = wrap(G.sign.text, 40), w = Math.max(...lines.map(l => l.length)) * 8 + 16, h = lines.length * 11 + 9, x = Math.round((VW - w) / 2); box(x, 25, w, h); lines.forEach((l, i) => txt(l, VW / 2, 30 + i * 11, '#f6eedd', 'center')); }
  if (G.t < 150 && !G.done) { const nm = G.def.name.toUpperCase(), w = Math.max(nm.length, 9) * 8 + 32; box((VW - w) >> 1, 62, w, 36, '#1c1429', '#ff8a3d'); txt('WORLD ' + G.id, VW / 2, 70, '#b9a9cf', 'center'); txt(nm, VW / 2, 84, '#ffd9b8', 'center'); }
  if (G.dying && G.dying < 40) { ctx.fillStyle = `rgba(18,12,26,${(40 - G.dying) / 40})`; ctx.fillRect(0, 0, VW, VH); }
}

// ---------- drawing: title + map
function drawGroundStrip(theme, off) { const A = tileArt(theme); for (let x = -T; x < VW + T; x += T) { const i = Math.floor((x + off) / T); const xx = Math.round(x - (off % T)); ctx.drawImage(A.grass[(hash(i, 1) * 4) | 0], xx, VH - 32); ctx.drawImage(A.dirt[(hash(i, 2) * 4) | 0], xx, VH - 16); } }
function renderTitle() {
  const off = tick * 0.6;
  drawBackground('meadow', off, tick); drawGroundStrip('meadow', off);
  ctx.drawImage(PIP[(tick >> 3) & 1 ? 'walk1' : 'walk2'][0], 60, VH - 48);
  ctx.drawImage(BLORB[(tick >> 3) & 1][1], 330, VH - 44);
  ctx.font = '28px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const [dx, dy, c] of [[3, 3, '#1c1428'], [-2, 0, '#1c1428'], [2, 0, '#1c1428'], [0, -2, '#1c1428'], [0, 2, '#1c1428'], [0, 0, '#f6eedd']]) { ctx.fillStyle = c; ctx.fillText('X-PEDITION', VW / 2 + dx, 26 + dy); }
  const tw = ctx.measureText('X-PEDITION').width; ctx.textAlign = 'left'; ctx.fillStyle = '#ff8a3d'; ctx.fillText('X', VW / 2 - tw / 2, 26);
  txt('A MATH ADVENTURE FOR MPM2D', VW / 2, 64, '#ffe9d4', 'center');
}
function renderMap() {
  const W = WORLDS[map.w - 1];
  const mt = W.theme || 'meadow'; drawBackground(mt, tick * 0.15, tick); drawGroundStrip(mt, tick * 0.15);
  ctx.fillStyle = 'rgba(20,14,30,0.7)'; ctx.fillRect(0, 0, VW, 30);
  txt('WORLD ' + W.n + ': ' + W.name.toUpperCase(), VW / 2, 5, '#ffd9b8', 'center');
  txt(W.unit.toUpperCase().replace(/·/g, '-').slice(0, 46), VW / 2, 17, '#b9a9cf', 'center');
  if (map.w > 1) txt('<', 10, 10, '#f6eedd'); if (map.w < WORLDS.length) txt('>', VW - 18, 10, '#f6eedd');
  if (progress.teacher) txt('TEACHER MODE', 6, 36, '#d59bff');
  if (!W.levels) {
    box(70, 80, 260, 62, '#1c1429', '#6b5590');
    txt('COMING SOON!', VW / 2, 92, '#ff8a3d', 'center');
    txt('THIS WORLD IS STILL BEING BUILT.', VW / 2, 110, '#f6eedd', 'center');
    txt('ARROW KEYS: SEE OTHER WORLDS', VW / 2, 126, '#b9a9cf', 'center');
  } else {
    for (let i = 0; i < NODES.length - 1; i++) { const [ax, ay] = NODES[i], [bx, by] = NODES[i + 1]; for (let k = 2; k < 14; k++) { const u = k / 15; ctx.fillStyle = '#1c1428'; ctx.fillRect(Math.round(ax + (bx - ax) * u) - 1, Math.round(ay + (by - ay) * u) - 1, 4, 4); ctx.fillStyle = '#ffe9d4'; ctx.fillRect(Math.round(ax + (bx - ax) * u), Math.round(ay + (by - ay) * u), 2, 2); } }
    W.levels.forEach((lv, i) => {
      const [nx, ny] = NODES[i], s = progress.stars[lv.id] | 0, open = lv.ready && isUnlocked(W.n, i + 1);
      const col = !lv.ready ? '#6b5a80' : s ? '#63d471' : open ? '#ff8a3d' : '#6b5a80';
      const r = lv.boss ? 10 : 8;
      ctx.fillStyle = '#1c1428'; ctx.fillRect(nx - r - 2, ny - r - 1, r * 2 + 4, r * 2 + 4);
      ctx.fillStyle = col; ctx.fillRect(nx - r, ny - r, r * 2, r * 2); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(nx - r, ny - r, r * 2, 2);
      if (lv.boss) { ctx.fillStyle = '#1c1428'; ctx.fillRect(nx - 5, ny - 4, 10, 9); ctx.fillRect(nx - 6, ny - 6, 2, 3); ctx.fillRect(nx - 1, ny - 6, 2, 3); ctx.fillRect(nx + 4, ny - 6, 2, 3); ctx.fillStyle = col; ctx.fillRect(nx - 1, ny + 1, 2, 4); }
      else txt(String(i + 1), nx + 1, ny - 3, '#1c1428', 'center', null);
      if (!lv.ready) { ctx.fillStyle = '#ffd23f'; for (let k = 0; k < 4; k++) ctx.fillRect(nx - 9 + k * 5, ny + r + 3, 3, 2); }
      else for (let k = 0; k < 3; k++) star(nx - 12 + k * 9, ny + r + 4, k < s);
    });
    const [px, py] = NODES[map.sel], lv = W.levels[map.sel];
    ctx.drawImage(PIP.idle[0], px - 6, py - 30 + Math.round(Math.sin(tick / 10) * 2));
    box(40, 168, 320, 44, '#1c1429', '#f6eedd');
    txt(lv.id + '  ' + lv.name.toUpperCase(), 50, 175, '#ffd9b8');
    txt(lv.lessons.toUpperCase().replace(/·/g, '-').replace(/–/g, '-').slice(0, 38), 50, 188, '#b9a9cf');
    const status = !lv.ready ? 'COMING SOON' : !isUnlocked(W.n, map.sel + 1) ? 'LOCKED' : progress.resume && progress.resume.id === lv.id ? 'ENTER: CONTINUE' : 'ENTER: PLAY';
    txt(status, 350, 200, lv.ready && isUnlocked(W.n, map.sel + 1) ? '#63d471' : '#8a7aa3', 'right');
    for (let k = 0; k < 3; k++) star(50 + k * 9, 200, k < (progress.stars[lv.id] | 0));
    if (progress.best[lv.id]) txt('BEST ' + fmtN(progress.best[lv.id]), 84, 200, '#ffd9b8');
  }
  txt('TOTAL SCORE ' + fmtN(progress.total || 0), VW - 6, VH - 10, '#ffd23f', 'right');
  if (W.levels && progress.resume) { const i = W.levels.findIndex(l => l.id === progress.resume.id); if (i >= 0) { const [nx, ny] = NODES[i]; txt('SAVED', nx, ny - 44 + Math.round(Math.sin(tick / 12) * 2), '#7ef0c4', 'center'); } }
}

// ---------- main loop
function render() {
  if (mode === 'play') renderPlay(); else if (mode === 'map') renderMap(); else renderTitle();
  if (toast) { const w = toast.t.length * 8 + 16; box((VW - w) / 2, VH / 2 - 10, w, 18, '#2a1f3a', '#ff8a3d'); txt(toast.t, VW / 2, VH / 2 - 5, '#ffe9d4', 'center'); if (--toast.life <= 0) toast = null; }
  document.getElementById('touch').classList.toggle('hidden', !(settings.touch && mode === 'play' && !UI.children.length));
  document.getElementById('menuBtn').classList.toggle('onmap', mode === 'map');
  document.getElementById('menuBtn').classList.toggle('hidden', !((mode === 'play' || mode === 'map') && !UI.children.length && !(G && mode === 'play' && G.done)));
}
function update() {
  tick++;
  if (pressed.music) { settings.music = !settings.music; saveSettings(); setToast('MUSIC ' + onOff(settings.music)); }
  if (mode === 'play') updatePlay(); else if (mode === 'map') updateMap();
  for (const k in pressed) delete pressed[k];
}
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  render(); musicTick(); requestAnimationFrame(loop);
}
document.getElementById('menuBtn').onclick = () => { audioInit(); SFX.select(); if (mode === 'play' && !UI.children.length) openPause(); else if (mode === 'map' && !UI.children.length) openMapMenu(); };
document.getElementById('fsBtn').onclick = () => { const s = document.getElementById('stage'); try { if (document.fullscreenElement) document.exitFullscreen(); else s.requestFullscreen().catch(() => { }); } catch (e) { } };
window.__xp = { Q, startLevel, showMap, showTitle, readCode, makeCode, bankSelfTest, SKILLS, checkAnswer, get G() { return G; }, get progress() { return progress; }, keys, pressed };
showTitle();
requestAnimationFrame(loop);
}
